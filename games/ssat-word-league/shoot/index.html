<style>

<script>
{
/* ============ 1:1 Shootout — a mini game inside Word League ============
   Coins live in Word League: parent.MG (info / pay / earn / close). Opened on its own it is practice only. */
const LOCAL=/^(127\.0\.0\.1|localhost)$/.test(location.hostname);
if(window.top===window.self&&!LOCAL){location.replace('../');throw new Error('open inside Word League')}
const H=(()=>{try{return parent!==window&&parent.MG?parent.MG:null}catch(e){return null}})();
const QS=new URLSearchParams(location.search);
const KO=((H&&H.lang)||QS.get('lang')||'ko')!=='en';
const L=(k,e)=>KO?k:e;
document.documentElement.lang=KO?'ko':'en';
const T=THREE,V3=T.Vector3,D2R=Math.PI/180,TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,sm=t=>{t=clamp(t,0,1);return t*t*(3-2*t)},eo=t=>1-(1-clamp(t,0,1))**3;
const rnd=(a,b)=>a+Math.random()*(b-a),$=id=>document.getElementById(id);
// keyframes: [[t,v],...] smooth between keys
const kf=(t,K)=>{if(t<=K[0][0])return K[0][1];for(let i=1;i<K.length;i++)if(t<=K[i][0]){const a=K[i-1],b=K[i];return lerp(a[1],b[1],sm((t-a[0])/(b[0]-a[0])))}return K[K.length-1][1]};
// critically damped spring (the camera / pose smoothing idea from Sumiro's camera rig)
function spring(s,target,w,dt){if(!isFinite(s.x)){s.x=target;s.v=0}const e=Math.exp(-w*dt),d=s.x-target,o=(s.v+w*d)*dt;s.v=(s.v-w*o)*e;s.x=target+(d+o)*e;return s.x}
const SP=()=>({x:NaN,v:0});

/* ---------------- rules ---------------- */
const SHOTS=10,NEED=7,DAYMAX=(H&&H.info&&H.info().day)||3;
const ENTRIES=[10,20,30];
const BONUS={7:.3,8:.5,9:.8,10:1};       // extra coins on top of the entry, as a share of the entry
const payout=(entry,goals)=>goals>=NEED?entry+Math.round(entry*BONUS[Math.min(10,goals)]):0;

/* ---------------- renderer / scene ---------------- */
const MOBILE=matchMedia('(pointer:coarse)').matches,SK=MOBILE?L('🦶 기술 버튼','🦶 Skill'):L('Space (기술)','Space (skill)');
const ren=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
const DPRMAX=Math.min(MOBILE?1.6:2,window.devicePixelRatio||1);
let px=DPRMAX;ren.setPixelRatio(px);
ren.outputEncoding=T.sRGBEncoding;ren.toneMapping=T.ACESFilmicToneMapping;ren.toneMappingExposure=1.08;
ren.shadowMap.enabled=true;ren.shadowMap.type=T.PCFSoftShadowMap;ren.physicallyCorrectLights=false;
document.body.prepend(ren.domElement);
const scene=new T.Scene();
const SKYC=new T.Color(0xc9dcef);scene.fog=new T.Fog(SKYC,70,210);
const cam=new T.PerspectiveCamera(50,1,.1,400);
function resize(){const w=innerWidth,h=innerHeight;ren.setSize(w,h);cam.aspect=w/h;cam.fov=w/h<1?64:50;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

// sky dome with a warm sun glow
{const g=new T.SphereGeometry(300,32,16),m=new T.ShaderMaterial({side:T.BackSide,depthWrite:false,fog:false,uniforms:{sun:{value:new V3(-.45,.38,.8).normalize()}},
 vertexShader:'varying vec3 vd;void main(){vd=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:'uniform vec3 sun;varying vec3 vd;void main(){float h=clamp(vd.y,0.,1.);vec3 top=vec3(.23,.45,.78),hor=vec3(.80,.87,.94);vec3 c=mix(hor,top,pow(h,.55));float s=max(dot(vd,sun),0.);c+=vec3(1.,.85,.6)*(pow(s,40.)*.6+pow(s,6.)*.12);gl_FragColor=vec4(c,1.);}'});
 scene.add(new T.Mesh(g,m))}
const hemi=new T.HemisphereLight(0xd7e8ff,0x40592c,.72);scene.add(hemi);
const sun=new T.DirectionalLight(0xfff0d8,1.55);sun.castShadow=true;
const SM=MOBILE?1024:2048;sun.shadow.mapSize.set(SM,SM);
Object.assign(sun.shadow.camera,{left:-20,right:20,top:20,bottom:-20,near:1,far:120});sun.shadow.camera.updateProjectionMatrix();sun.shadow.bias=-.0004;sun.shadow.normalBias=.02;
scene.add(sun,sun.target);
const SUNOFF=new V3(-32,46,58);

/* ---------------- textures (all drawn here) ---------------- */
function cvs(w,h,f){const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);return c}
const ANISO=ren.capabilities.getMaxAnisotropy();
function tex(c,rep){const t=new T.CanvasTexture(c);t.encoding=T.sRGBEncoding;t.anisotropy=ANISO;if(rep){t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(rep[0],rep[1])}return t}
const grassC=cvs(512,512,(x,w,h)=>{x.fillStyle='#3d7a2b';x.fillRect(0,0,w,h);
 for(let i=0;i<26000;i++){const g=90+Math.random()*70|0,r=40+Math.random()*30|0;x.strokeStyle=`rgba(${r},${g},${30+Math.random()*25|0},${.35+Math.random()*.4})`;const X=Math.random()*w,Y=Math.random()*h,a=rnd(-.6,.6)-Math.PI/2,l=rnd(3,8);x.lineWidth=rnd(.6,1.4);x.beginPath();x.moveTo(X,Y);x.lineTo(X+Math.cos(a)*l,Y+Math.sin(a)*l);x.stroke()}
 for(let i=0;i<60;i++){x.fillStyle=`rgba(${Math.random()<.5?20:120},${Math.random()<.5?60:110},20,.05)`;x.beginPath();x.arc(Math.random()*w,Math.random()*h,rnd(20,70),0,TAU);x.fill()}});
// ball: white with curved panels (a made-up design)
const ballC=cvs(512,256,(x,w,h)=>{x.fillStyle='#f4f4f2';x.fillRect(0,0,w,h);
 const cols=['#1d3fbf','#e2231a','#111827'];for(let k=0;k<3;k++){x.strokeStyle=cols[k];x.lineWidth=16;x.beginPath();for(let i=0;i<=w;i+=4){const y=h/2+Math.sin(i/w*TAU*2+k*2.1)*h*.3;i?x.lineTo(i,y):x.moveTo(i,y)}x.stroke()}
 x.strokeStyle='rgba(0,0,0,.25)';x.lineWidth=2;for(let k=0;k<6;k++){x.beginPath();for(let i=0;i<=w;i+=4){const y=h/2+Math.sin(i/w*TAU*3+k)*h*.42;i?x.lineTo(i,y):x.moveTo(i,y)}x.stroke()}});
const netC=cvs(128,128,(x,w,h)=>{x.clearRect(0,0,w,h);x.strokeStyle='#fff';x.lineWidth=7;x.beginPath();x.moveTo(0,h/2);x.lineTo(w/2,0);x.lineTo(w,h/2);x.lineTo(w/2,h);x.closePath();x.stroke()});
const crowdC=cvs(256,256,(x,w,h)=>{x.fillStyle='#2a2f3a';x.fillRect(0,0,w,h)});
function boardC(txt,bg,fg){return cvs(1024,128,(x,w,h)=>{x.fillStyle=bg;x.fillRect(0,0,w,h);x.fillStyle=fg;x.font='900 74px system-ui,sans-serif';x.textBaseline='middle';x.textAlign='center';x.fillText(txt,w/2,h/2+4)})}

/* ---------------- pitch ---------------- */
const GW=7.32,GH=2.44,PR=.06,BR=.11;  // goal width/height, post radius, ball radius
{const gt=tex(grassC,[1,1]);const strips=22,len=110,sw=5;
 for(let i=0;i<strips;i++){const m=new T.MeshStandardMaterial({map:gt,roughness:.97,color:i%2?0xffffff:0xd6e8c8});
  const g=new T.PlaneGeometry(90,sw);const uv=g.attributes.uv;for(let k=0;k<uv.count;k++)uv.setXY(k,uv.getX(k)*90/4,uv.getY(k)*sw/4+i*sw/4);
  const p=new T.Mesh(g,m);p.rotation.x=-Math.PI/2;p.position.set(0,0,-6+i*sw+sw/2-len*0+0);p.receiveShadow=true;scene.add(p)}
 // behind the goal line
 const g2=new T.PlaneGeometry(90,40),uv2=g2.attributes.uv;for(let k=0;k<uv2.count;k++)uv2.setXY(k,uv2.getX(k)*90/4,uv2.getY(k)*10);
 const back=new T.Mesh(g2,new T.MeshStandardMaterial({map:gt,roughness:.97,color:0xc4d8b4}));back.rotation.x=-Math.PI/2;back.position.set(0,-.002,-26);back.receiveShadow=true;scene.add(back);
 // painted lines
 const lm=new T.MeshStandardMaterial({color:0xf3f6f0,roughness:.85,polygonOffset:true,polygonOffsetFactor:-2});
 const line=(x1,z1,x2,z2,w=.12)=>{const l=Math.hypot(x2-x1,z2-z1),m=new T.Mesh(new T.PlaneGeometry(w,l),lm);m.rotation.x=-Math.PI/2;m.rotation.z=Math.atan2(x2-x1,z2-z1);m.position.set((x1+x2)/2,.004,(z1+z2)/2);m.receiveShadow=true;scene.add(m)};
 line(-34,0,34,0);line(-20.16,0,-20.16,16.5);line(20.16,0,20.16,16.5);line(-20.16,16.5,20.16,16.5);
 line(-9.16,0,-9.16,5.5);line(9.16,0,9.16,5.5);line(-9.16,5.5,9.16,5.5);line(-34,0,-34,104);line(34,0,34,104);line(-34,52.5,34,52.5);
 const spot=new T.Mesh(new T.CircleGeometry(.12,16),lm);spot.rotation.x=-Math.PI/2;spot.position.set(0,.004,11);scene.add(spot);
 for(let i=0;i<24;i++){const a0=(-53+i*106/24)*D2R,a1=(-53+(i+1)*106/24)*D2R;line(Math.sin(a0)*9.15,11+Math.cos(a0)*9.15,Math.sin(a1)*9.15,11+Math.cos(a1)*9.15)}
}
/* goal frame + net */
const GOAL={net:null,base:null,bulge:[]};
{const pm=new T.MeshStandardMaterial({color:0xffffff,roughness:.35});
 const cyl=(h,x,y,z,rz)=>{const m=new T.Mesh(new T.CylinderGeometry(PR,PR,h,20),pm);m.position.set(x,y,z);if(rz)m.rotation.z=rz;m.castShadow=true;scene.add(m)};
 cyl(GH+PR,-GW/2-PR,GH/2,0);cyl(GH+PR,GW/2+PR,GH/2,0);cyl(GW+PR*4,0,GH+PR,0,Math.PI/2);
 const sm2=new T.MeshStandardMaterial({color:0xd8d8d8,roughness:.6});
 const bar=(a,b)=>{const d=new V3().subVectors(b,a),m=new T.Mesh(new T.CylinderGeometry(.025,.025,d.length(),8),sm2);m.position.copy(a).addScaledVector(d,.5);m.quaternion.setFromUnitVectors(new V3(0,1,0),d.normalize());scene.add(m)};
 for(const s of[-1,1]){bar(new V3(s*(GW/2+PR),GH,0),new V3(s*(GW/2+PR),GH,-1));bar(new V3(s*(GW/2+PR),GH,-1),new V3(s*(GW/2+PR),0,-2));bar(new V3(s*(GW/2+PR),0,-2),new V3(s*(GW/2+PR),0,0))}
 bar(new V3(-GW/2-PR,GH,-1),new V3(GW/2+PR,GH,-1));bar(new V3(-GW/2-PR,0,-2),new V3(GW/2+PR,0,-2));
 const nt=new T.CanvasTexture(netC);nt.wrapS=nt.wrapT=T.RepeatWrapping;nt.anisotropy=ANISO;
 const nm=new T.MeshStandardMaterial({color:0xffffff,alphaMap:nt,alphaTest:.5,transparent:false,side:T.DoubleSide,roughness:.9});
 // back net: a grid we can push when the ball hits it
 const NX=36,NY=14,g=new T.PlaneGeometry(1,1,NX,NY),p=g.attributes.position,uv=g.attributes.uv;
 for(let i=0;i<p.count;i++){const u=uv.getX(i),v=uv.getY(i);const x=(u-.5)*(GW+PR*2),y=v*GH,z=-(1+(1-v));p.setXYZ(i,x,y,z);uv.setXY(i,u*GW/.12,v*2.7/.12)}
 g.computeVertexNormals();const back=new T.Mesh(g,nm);back.castShadow=true;scene.add(back);GOAL.net=g;GOAL.base=Float32Array.from(p.array);
 const side=s=>{const g=new T.BufferGeometry(),v=[],u=[],x=s*(GW/2+PR);v.push(x,0,0, x,GH,0, x,GH,-1, x,0,-2);u.push(0,0, 0,GH/.12, 1/.12,GH/.12, 2/.12,0);g.setAttribute('position',new T.Float32BufferAttribute(v,3));g.setAttribute('uv',new T.Float32BufferAttribute(u,2));g.setIndex([0,1,2,0,2,3]);g.computeVertexNormals();const m=new T.Mesh(g,nm);m.castShadow=true;scene.add(m)};
 side(-1);side(1);
 const roof=new T.Mesh(new T.PlaneGeometry(GW+PR*2,1),nm);roof.material=nm.clone();roof.material.alphaMap=nt.clone();roof.material.alphaMap.repeat.set((GW)/.12,1/.12);roof.material.alphaMap.needsUpdate=true;roof.rotation.x=-Math.PI/2;roof.position.set(0,GH,-.5);scene.add(roof);
}
function netHit(x,y,str){GOAL.bulge.push({x,y,a:str,t:0})}
function netUpdate(dt){if(!GOAL.bulge.length)return;const p=GOAL.net.attributes.position,b=GOAL.base;
 for(let i=0;i<p.count;i++){let dz=0;const x=b[i*3],y=b[i*3+1];for(const k of GOAL.bulge){const d2=(x-k.x)**2+(y-k.y)**2,w=Math.exp(-d2/1.1);dz+=k.a*w*Math.exp(-k.t*2.2)*Math.cos(k.t*7)}p.setZ(i,b[i*3+2]-dz)}
 p.needsUpdate=true;GOAL.bulge.forEach(k=>k.t+=dt);GOAL.bulge=GOAL.bulge.filter(k=>k.t<3);if(!GOAL.bulge.length)p.array.set(b)}

/* stands, boards and a crowd drawn with one instanced mesh */

const KD=.0135,KM=.0042,G=9.81;
function ballAcc(p,v,w,kn,t,out){const s=v.length();out.set(0,-G,0).addScaledVector(v,-KD*s);
 out.x+=KM*(w.y*v.z-w.z*v.y);out.y+=KM*(w.z*v.x-w.x*v.z);out.z+=KM*(w.x*v.y-w.y*v.x);
 if(kn){out.x+=kn.a*Math.sin(t*kn.f*TAU+kn.p1);out.y+=kn.a*.6*Math.sin(t*kn.f2*TAU+kn.p2)}return out}
// fly a copy of the ball until it reaches the goal line; returns the crossing point and time
function flyTo(p0,v0,w,kn,zEnd=0){const p=p0.clone(),v=v0.clone(),a=new V3();let t=0;const dt=1/240;
 while(t<4){ballAcc(p,v,w,kn,t,a);v.addScaledVector(a,dt);const pz=p.z;p.addScaledVector(v,dt);t+=dt;if(p.y<BR){p.y=BR;v.y=Math.abs(v.y)*.55}
  if(p.z<=zEnd&&pz>zEnd){const f=(pz-zEnd)/(pz-p.z);return{x:p.x,y:p.y,t:t-dt*(1-f)}}}return{x:p.x,y:p.y,t}}
// find the kick that lands on target (aim → velocity), the physics includes spin
function solveKick(p0,tgt,speed,w,kn){const d=new V3(tgt.x-p0.x,tgt.y-p0.y,-p0.z).normalize();const v=d.multiplyScalar(speed);
 for(let i=0;i<10;i++){const c=flyTo(p0,v,w,kn);const ex=tgt.x-c.x,ey=tgt.y-c.y;if(Math.abs(ex)<.01&&Math.abs(ey)<.01)break;const tt=Math.max(.2,c.t);v.x+=ex/tt;v.y+=ey/tt*1.05;v.setLength(speed)}return v}

function skinTone(mesh){try{const g=mesh.geometry,img=mesh.material.map.image,P=g.attributes.position,U=g.attributes.uv;const c=cvs(img.width,img.height,x=>x.drawImage(img,0,0)).getContext('2d');
  const D=c.getImageData(0,0,c.canvas.width,c.canvas.height).data,acc=[];for(let i=0;i<P.count;i+=3){const y=P.getY(i),zz=P.getZ(i);if(y>1.47&&y<1.6&&zz>.06){const u=U.getX(i),v=U.getY(i),k=((v*(c.canvas.height-1)|0)*c.canvas.width+(u*(c.canvas.width-1)|0))*4;acc.push([D[k],D[k+1],D[k+2]])}}

  s.vertexShader='attribute vec4 zcat;\nvarying vec4 vZC;\nvarying float vBY;\n'+s.vertexShader.replace('#include <begin_vertex>','#include <begin_vertex>\nvZC=zcat;vBY=position.y;');

  float hd=1.-(vZC.x+vZC.y+vZC.z+vZC.w),mx=max(max(vZC.x,vZC.y),max(vZC.z,vZC.w)),y=vBY,vZone=0.;

// rotate bones in the character's own space (x: its left, y: up, z: forward), on top of the rest pose
const QT=new T.Quaternion(),QE=new T.Euler(),QT2=new T.Quaternion();
const POSEB=['Hips','Spine02','Spine01','Spine','neck','Head','LeftUpLeg','LeftLeg','LeftFoot','RightUpLeg','RightLeg','RightFoot','LeftArm','LeftForeArm','RightArm','RightForeArm','LeftShoulder','RightShoulder'];
function makeRig(model){const b={};model.traverse(o=>{if(o.isBone)b[o.name]=o});model.updateMatrixWorld(true);const ri=model.getWorldQuaternion(new T.Quaternion()).invert(),R={};
 for(const n of POSEB){const o=b[n];if(!o)continue;const w=ri.clone().multiply(o.getWorldQuaternion(new T.Quaternion()));R[n]={o,l:o.quaternion.clone(),w,wi:w.clone().invert()}}return{R,b}}
function applyPose(rig,P){for(const n in rig.R){const r=rig.R[n],e=P[n];if(!e){r.o.quaternion.copy(r.l);continue}
 QT.setFromEuler(QE.set(e[0]*D2R,e[1]*D2R,e[2]*D2R,'YXZ'));r.o.quaternion.copy(r.l).multiply(QT2.copy(r.wi).multiply(QT).multiply(r.w))}}
// how much lower the hips sit when the legs bend, so the feet stay on the grass
const L1=.37,L2=.343;
function legDrop(P){const h=s=>{const t=(P[s+'UpLeg']||[0,0,0]),k=(P[s+'Leg']||[0,0,0]);return(L1*Math.cos(t[0]*D2R)+L2*Math.cos((t[0]+k[0])*D2R))*Math.cos(t[2]*D2R)};return L1+L2-Math.max(h('Left'),h('Right'))}

class Player{constructor(kind,kit,hand){const src=MODELS[kind];this.root=new T.Group();this.body=new T.Group();this.root.add(this.body);scene.add(this.root);
  const model=T.SkeletonUtils.clone(src.scene);this.body.add(model);this.model=model;let sk=null;
  model.traverse(o=>{if(o.isSkinnedMesh){sk=o;o.castShadow=true;o.receiveShadow=true;o.frustumCulled=false;zoneGeometry(o);o.material=kitMaterial(o.material,kit,src.skin)}});
  this.rig=makeRig(model);const hb=this.rig.b;if(hb.LeftHand){hb.LeftHand.scale.setScalar(hand);hb.RightHand.scale.setScalar(hand)}
  this.P={};this.cur={};this.shiftX=0;this.x=0;this.z=0;this.vx=0;this.yaw=0;this.ph=0;this.lift=0;this.roll=0;this.shift=0}
 place(x,z,yaw){this.shiftX=0;this.x=x;this.z=z;this.yaw=yaw;this.vx=0;this.lift=0;this.roll=0;this.shift=0;this.body.rotation.set(0,0,0);this.body.position.set(0,0,0);this.cur={}}
 // blend toward the wanted pose (rate: higher = snappier)
 pose(P,dt,rate=16){const k=1-Math.exp(-rate*dt),C=this.cur;for(const n in P){const a=C[n]||(C[n]=[0,0,0]),b=P[n];a[0]+=(b[0]-a[0])*k;a[1]+=(b[1]-a[1])*k;a[2]+=(b[2]-a[2])*k}
  for(const n in C)if(!P[n]){const a=C[n];a[0]-=a[0]*k;a[1]-=a[1]*k;a[2]-=a[2]*k}applyPose(this.rig,C);this.drop=legDrop(C)}
 sync(bob=0){this.root.position.set(this.x,0,this.z);this.root.rotation.y=this.yaw;this.body.position.y=this.lift-(this.drop||0)+bob}}

 if(A.gkFix!=null&&!P.fixed&&A.shotT>=A.gkFix){P.fixed=true;const r=flyTo(B.p,B.v,B.w,B.knuck,gk.z);if(P.t<P.dur*.35){P.t=-.06;setDive(r.x,r.y)}else{P.late=true}}
 const p=clamp(P.t/P.dur,0,1);if(P.t<0||P.stay){gk.pose(poseKeeper(A.t),dt);return}
 const e=dvE(p);gk.pose(P.low&&P.y<1.2?poseDive(p*.6,P.dir):poseDive(p,P.dir),dt,26);
 gk.shiftX=P.shift*e;gk.lift=Math.sin(Math.PI*Math.min(1,p*1.1))*.28*Math.min(1,P.y/1.2);gk.roll=-P.dir*P.alpha*D2R*e}
function ballPhysics(dt){const n=Math.max(1,Math.ceil(dt/(1/240))),h=dt/n,a=new V3();
 for(let s=0;s<n;s++){B.t+=h;ballAcc(B.p,B.v,B.w,B.knuck,B.t,a);B.v.addScaledVector(a,h);const pz=B.p.z;B.p.addScaledVector(B.v,h);B.w.multiplyScalar(1-.15*h);
  if(B.p.y<BR){B.p.y=BR;if(B.v.y<-.6)SFX.touch();B.v.y=Math.abs(B.v.y)*.5;B.v.x*=.86;B.v.z*=.86;if(Math.abs(B.v.y)<.3)B.v.y=0;B.v.x*=1-1.6*h;B.v.z*=1-1.6*h}
  if(A.phase!=='flight')continue;
  // keeper
  if(!A.saved&&Math.abs(B.p.z-gk.z)<.45){const s=keeperBody();if(segDist(B.p.x,B.p.y,s)<.19+BR){A.saved=true;SFX.save();const away=Math.sign(B.p.x-gk.x)||1;B.v.set(away*rnd(2,5),rnd(1.5,4),Math.abs(B.v.z)*.35);B.w.set(0,0,rnd(-20,20));B.knuck=null;
   endAttempt(false,L('선방!','Saved!'),L('골키퍼가 막았어요','The keeper stopped it'));return}}
  // posts and crossbar
  for(const px of[-GW/2-PR,GW/2+PR]){const dx=B.p.x-px,dz=B.p.z;const d=Math.hypot(dx,dz);if(d<PR+BR&&B.p.y<GH+PR){const nx=dx/d,nz=dz/d,vn=B.v.x*nx+B.v.z*nz;if(vn<0){B.v.x-=1.6*vn*nx;B.v.z-=1.6*vn*nz;A.post=true;SFX.post()}}}
  {const dy=B.p.y-(GH+PR),dz=B.p.z,d=Math.hypot(dy,dz);if(d<PR+BR&&Math.abs(B.p.x)<GW/2+PR){const ny=dy/d,nz=dz/d,vn=B.v.y*ny+B.v.z*nz;if(vn<0){B.v.y-=1.6*vn*ny;B.v.z-=1.6*vn*nz;A.post=true;SFX.post()}}}
  // goal line
  if(pz>0&&B.p.z<=0){if(Math.abs(B.p.x)<GW/2-BR*.2&&B.p.y<GH){A.inGoal=true}}
  if(A.inGoal&&!A.res){const depth=-(1+(1-B.p.y/GH));if(B.p.z<depth+BR||Math.abs(B.p.x)>GW/2-BR||B.p.y>GH-BR){netHit(B.p.x,B.p.y,clamp(B.v.length()*.035,.2,.7));SFX.net();B.v.multiplyScalar(.12);B.v.z=Math.abs(B.v.z)*.2;
    endAttempt(true,L('골!!!','GOAL!!!'),A.post?L('골대 맞고 들어갔어요!','In off the post!'):{curl:L('멋진 감아차기!','What a curler!'),knuckle:L('무회전 대포알!','Knuckleball rocket!'),inside:L('정확한 마무리!','Clinical finish!')}[A.kick.tech]);return}}
  if(!A.inGoal&&B.p.z<-.4){endAttempt(false,A.post?L('골대!','Off the post!'):L('빗나갔어요','Missed!'),A.post?L('아깝다…','So close…'):(B.p.y>GH?L('너무 높았어요','Too high'):L('골대 밖으로 나갔어요','Wide of the goal')));return}
  if(B.p.z<-5.1){B.p.z=-5.1;B.v.z=Math.abs(B.v.z)*.3}}
 if(A.phase==='flight'&&(A.shotT>3.5||(B.v.length()<1&&A.shotT>1))&&!A.res)endAttempt(false,L('빗나갔어요','Missed!'),'')}

/* ---------------- camera (spring-follow) ---------------- */
function camera(dt){let px,py,pz,lx,ly,lz,w=5;
 if(window.__CAM){const c=window.__CAM;cam.position.set(...c.p);cam.lookAt(...c.l);return}
 if(!A||GS.mode!=='play'){const t=performance.now()/1000*.08;px=Math.sin(t)*14;py=5.5;pz=20+Math.cos(t)*4;lx=0;ly=1;lz=4;w=2}
 else if(A.phase==='ready'||A.phase==='dribble'){px=me.x*.75;py=2.5;pz=me.z+5.6;lx=me.x*.5;ly=1.1;lz=me.z-7;w=6}
 else if(A.phase==='aim'){px=B.p.x*.6+.6;py=1.75;pz=B.p.z+3.6;lx=A.aim.x*.25;ly=1.25;lz=0;w=7}
 else{const f=A.phase==='flight'?1:.9;px=lerp(B.p.x*.5,B.p.x*.35,f);py=1.8;pz=Math.max(B.p.z+4.2,5.5);lx=B.p.x*.6;ly=Math.max(1,B.p.y*.6+.5);lz=Math.min(B.p.z,-0.5);w=4}
 const S=camS;cam.position.set(spring(S.px,px,w,dt),spring(S.py,py,w,dt),spring(S.pz,pz,w,dt));cam.lookAt(spring(S.lx,lx,w*1.3,dt),spring(S.ly,ly,w*1.3,dt),spring(S.lz,lz,w*1.3,dt));
 const c=A&&GS.mode==='play'?me:null;const tx=c?c.x*.5:0,tz=c?Math.min(c.z,16)-6:6;sun.target.position.set(tx,0,tz);sun.position.set(tx,0,tz).add(SUNOFF)}

 <div class="keys">${L('⌨️ ◀ ▶ 이동 · Space 기술(페인트) → 슛 단계: 1 2 3 기술 · 화살표/드래그 조준 · Space 게이지 시작, 가운데에서 한 번 더','⌨️ ◀ ▶ move · Space skill (fake) → shooting: 1 2 3 pick kick · arrows/drag aim · Space starts the gauge, again in the middle')}<br>${L('📱 화면 버튼으로도 할 수 있어요','📱 On-screen buttons work too')}</div></div>`;
 $('lobby').classList.remove('hide');

function finish(){GS.mode='over';A=null;ui('none');$('quit').classList.add('hide');const g=GS.goals,win=g>=NEED,P=GS.practice?0:payout(GS.entry,g);let now=null;

let last=performance.now(),paused=false;const AX=new V3();const AR={acc:0,n:0,cool:2};

 AR.acc+=rdt;AR.n++;AR.cool-=rdt;if(AR.n>=45){const avg=AR.acc/AR.n;AR.acc=0;AR.n=0;if(AR.cool<=0){let p=px;if(avg>1/42)p=Math.max(.65,p*.85);else if(avg<1/57&&p<DPRMAX)p=Math.min(DPRMAX,p*1.08);if(Math.abs(p-px)>.02){px=p;ren.setPixelRatio(px);resize();AR.cool=2}}}
 if(GS.mode==='play'&&A&&!paused){const target=A.phase==='aim'&&!A.kick?.16:1;tScale+=(target-tScale)*(1-Math.exp(-rdt*(target<tScale?10:14)));update(rdt*tScale,rdt)}

  if(B.p.y<=BR+.001){const sp=Math.hypot(B.v.x,B.v.z);if(sp>.05)rollBall(B.v.x*rdt*tScale,B.v.z*rdt*tScale)}}
