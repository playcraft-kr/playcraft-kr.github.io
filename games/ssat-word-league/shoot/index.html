<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>1:1 Shootout · Word League</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b1220;color:#fff;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
canvas{display:block}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.38) 100%)}
.hide{display:none!important}
#top{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;justify-content:flex-start;gap:10px;padding:10px 96px 10px 12px;flex-wrap:wrap;pointer-events:none;text-shadow:0 2px 6px rgba(0,0,0,.6)}
#dots{display:flex;gap:6px}#dots i{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:rgba(0,0,0,.25);display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:900}
#dots i.g{background:#22c55e;border-color:#22c55e}#dots i.m{background:#ef4444;border-color:#ef4444}#dots i.now{box-shadow:0 0 0 3px rgba(255,214,0,.85)}
#score{font-weight:900;font-size:18px;background:rgba(0,0,0,.35);padding:4px 12px;border-radius:999px;white-space:nowrap}
@media (max-width:560px){#top{justify-content:flex-start;gap:6px;padding:8px 86px 8px 8px}#dots{gap:3px}#dots i{width:13px;height:13px;font-size:8px;border-width:1.5px}#score{font-size:13px;padding:3px 9px}#quit{font-size:12px;padding:5px 10px}.cb{min-width:50px;height:52px}}
#quit{position:fixed;top:8px;right:10px;pointer-events:auto;font:inherit;font-size:14px;color:#fff;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:6px 12px;cursor:pointer}
#msg{position:fixed;left:50%;top:22%;transform:translateX(-50%);text-align:center;pointer-events:none;font-weight:900;font-size:clamp(34px,7vw,76px);letter-spacing:.02em;text-shadow:0 4px 18px rgba(0,0,0,.55);white-space:nowrap}
#msg small{display:block;font-size:clamp(15px,2.4vw,22px);font-weight:700;margin-top:4px}
#msg .tst{display:inline-block;background:rgba(5,10,25,.62);padding:6px 14px;border-radius:14px;margin:0}
#msg.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}@keyframes pop{0%{transform:translateX(-50%) scale(.4);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}
#hint{position:fixed;left:50%;bottom:118px;transform:translateX(-50%);max-width:min(92vw,640px);text-align:center;font-size:15px;line-height:1.45;background:rgba(5,10,25,.62);padding:8px 14px;border-radius:14px;pointer-events:none}
#hint b{color:#ffd400}
#ret{position:fixed;width:46px;height:46px;margin:-23px 0 0 -23px;pointer-events:none;border-radius:50%;border:3px solid #ffd400;box-shadow:0 0 0 2px rgba(0,0,0,.5),inset 0 0 0 2px rgba(0,0,0,.35)}
#ret:after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#ffd400}
#gauge{position:fixed;left:50%;bottom:66px;transform:translateX(-50%);width:min(78vw,460px);height:26px;border-radius:13px;overflow:hidden;border:2px solid rgba(255,255,255,.85);box-shadow:0 4px 16px rgba(0,0,0,.5);background:#b91c1c}
#gauge .y{position:absolute;top:0;bottom:0;background:#eab308}#gauge .gr{position:absolute;top:0;bottom:0;background:#22c55e}
#gauge .n{position:absolute;top:-3px;bottom:-3px;width:5px;margin-left:-2.5px;background:#fff;box-shadow:0 0 6px #000}
#timer{position:fixed;left:50%;bottom:98px;transform:translateX(-50%);width:min(78vw,460px);height:5px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden}#timer i{display:block;height:100%;background:#ffd400}
#ctl{position:fixed;left:0;right:0;bottom:10px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 12px;pointer-events:none}
.cb{pointer-events:auto;font:inherit;font-weight:900;color:#fff;border:2px solid rgba(255,255,255,.55);background:rgba(10,20,45,.55);border-radius:18px;min-width:64px;height:56px;font-size:22px;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent}
.cb.on{background:rgba(255,212,0,.9);color:#111;border-color:#ffd400}
.cb small{display:block;font-size:11px;font-weight:700;opacity:.85;white-space:nowrap;word-break:keep-all}
#tech{display:flex;gap:8px;pointer-events:auto}#tech .cb{font-size:15px;min-width:86px;height:56px}
#techDesc{position:fixed;left:50%;bottom:164px;transform:translateX(-50%);font-size:13px;color:#dbe4ff;background:rgba(5,10,25,.55);padding:4px 10px;border-radius:10px;pointer-events:none;white-space:nowrap}
.pan{position:fixed;inset:0;display:grid;place-items:center;padding:14px;background:rgba(4,8,20,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);overflow:auto}
.card{width:min(560px,100%);background:rgba(13,20,48,.96);border:1px solid rgba(170,190,255,.22);border-radius:22px;padding:22px 20px;box-shadow:0 30px 60px -20px rgba(0,0,0,.7);text-align:center}
.card h1{margin:2px 0 6px;font-size:26px}.card .k{letter-spacing:.22em;font-size:11px;color:#9fb0dd}
.card p{color:#c3cce6;font-size:14.5px;line-height:1.55;margin:8px 0}
.card .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.btn{font:inherit;font-weight:800;font-size:16px;color:#fff;border:0;border-radius:999px;padding:11px 20px;background:linear-gradient(180deg,#6f93ff,#3a63ea);cursor:pointer}
.btn.gold{background:linear-gradient(180deg,#ffd75a,#e0a400);color:#2a1d00}.btn.ghost{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.ent{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.ent button{font:inherit;font-weight:900;font-size:17px;color:#fff;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);border-radius:14px;padding:10px 16px;cursor:pointer;min-width:92px}
.ent button.on{border-color:#ffd400;background:rgba(255,212,0,.16)}.ent button:disabled{opacity:.35;cursor:not-allowed}
.ent button small{display:block;font-size:11px;font-weight:700;color:#c3cce6}
table.pay{margin:8px auto 0;border-collapse:collapse;font-size:14px}table.pay td{padding:3px 10px;border-bottom:1px solid rgba(255,255,255,.08)}table.pay td:last-child{text-align:right;font-weight:800}
.pos{color:#4ade80}.neg{color:#f87171}
.big{font-size:44px;font-weight:900;margin:6px 0}
.keys{font-size:12.5px;color:#9fb0dd;margin-top:10px;line-height:1.6}
#skills{display:flex;gap:6px;pointer-events:auto}
#skills .cb{min-width:64px;height:62px;font-size:20px;position:relative;padding:0 6px}
#skills .cb small{font-size:10.5px}#skills .cb kbd{position:absolute;top:-9px;right:-6px;font:800 11px system-ui,sans-serif;background:#ffd400;color:#111;border-radius:6px;padding:2px 6px;box-shadow:0 2px 0 #b28f00}
#skills .cb.off{opacity:.4}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
#goalFx{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;overflow:hidden}
#goalFx .rays{position:absolute;width:170vmax;height:170vmax;background:repeating-conic-gradient(rgba(255,212,0,.28) 0 7deg,transparent 7deg 15deg);animation:gspin 7s linear infinite;-webkit-mask:radial-gradient(circle,#000 8%,transparent 55%);mask:radial-gradient(circle,#000 8%,transparent 55%)}
#goalFx .gt{position:relative;white-space:nowrap;font:900 clamp(72px,17vw,200px)/1 system-ui,"Noto Sans KR",sans-serif;filter:drop-shadow(0 7px 0 #7a1500) drop-shadow(0 16px 26px rgba(0,0,0,.55))}
#goalFx.go .gt{animation:gpop .75s cubic-bezier(.2,1.7,.4,1)}
#goalFx .gt span{display:inline-block;background:linear-gradient(180deg,#fffbe0,#ffd400 48%,#ff7a00);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:3px #7a1500;animation:gwob .9s ease-in-out infinite}
@keyframes gspin{to{transform:rotate(360deg)}}@keyframes gpop{0%{transform:scale(3.2);opacity:0}100%{transform:scale(1);opacity:1}}@keyframes gwob{50%{transform:translateY(-12px) rotate(-5deg)}}
#load{position:fixed;inset:0;display:grid;place-items:center;background:#0b1220;font-size:16px;color:#9fb0dd}
@media (max-width:560px){#ctl{padding:0 6px}#mv{gap:5px!important}.cb{min-width:48px}#tech{gap:5px}#tech .cb{min-width:58px;padding:0 6px;font-size:18px;height:58px;line-height:1.1}#tech .cb small{font-size:11px}#skills{gap:4px}#skills .cb{min-width:50px;height:58px;font-size:18px;padding:0 3px}#techDesc{white-space:normal;max-width:92vw;text-align:center;bottom:110px}}
@media (max-width:560px),(max-height:500px){#hint{font-size:13px;top:54px;bottom:auto}}
#hint,#techDesc,.card p,.keys,#msg small{word-break:keep-all}
</style></head>

 <div id="mv" style="display:flex;gap:8px"><button class="cb" id="bL">◀</button><button class="cb" id="bR">▶</button></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" integrity="sha384-CI3ELBVUz9XQO+97x6nwMDPosPR5XvsxW2ua7N1Xeygeh1IxtgqtCkGfQY9WWdHu" crossorigin="anonymous"></script>
<script src="lib/GLTFLoader.js"></script><script src="lib/SkeletonUtils.js"></script>
<script>
{
/* ============ 1:1 Shootout — a mini game inside Word League ============
   Coins live in Word League: parent.MG (info / pay / earn / close). Opened on its own it is practice only. */
const LOCAL=/^(127\.0\.0\.1|localhost)$/.test(location.hostname);
if(window.top===window.self&&!LOCAL){location.replace('../');throw new Error('open inside Word League')}
const H=(()=>{try{return parent!==window&&parent.MG?parent.MG:null}catch(e){return null}})();
const QS=new URLSearchParams(location.search);
const KO=((H&&H.lang)||QS.get('lang')||'ko')!=='en';
const L=(k,e)=>KO?k:e;
document.documentElement.lang=KO?'ko':'en';
const T=THREE,V3=T.Vector3,D2R=Math.PI/180,TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,sm=t=>{t=clamp(t,0,1);return t*t*(3-2*t)},eo=t=>1-(1-clamp(t,0,1))**3;
const rnd=(a,b)=>a+Math.random()*(b-a),$=id=>document.getElementById(id);
// keyframes: [[t,v],...] smooth between keys
const kf=(t,K)=>{if(t<=K[0][0])return K[0][1];for(let i=1;i<K.length;i++)if(t<=K[i][0]){const a=K[i-1],b=K[i];return lerp(a[1],b[1],sm((t-a[0])/(b[0]-a[0])))}return K[K.length-1][1]};
// critically damped spring (the camera / pose smoothing idea from Sumiro's camera rig)
function spring(s,target,w,dt){if(!isFinite(s.x)){s.x=target;s.v=0}const e=Math.exp(-w*dt),d=s.x-target,o=(s.v+w*d)*dt;s.v=(s.v-w*o)*e;s.x=target+(d+o)*e;return s.x}
const SP=()=>({x:NaN,v:0});

/* ---------------- rules ---------------- */
const SHOTS=10,NEED=7,DAYMAX=(H&&H.info&&H.info().day)||3;
const ENTRIES=[10,20,30];
const BONUS={7:.3,8:.5,9:.8,10:1};       // extra coins on top of the entry, as a share of the entry
const payout=(entry,goals)=>goals>=NEED?entry+Math.round(entry*BONUS[Math.min(10,goals)]):0;

/* ---------------- renderer / scene ---------------- */
const MOBILE=matchMedia('(pointer:coarse)').matches,SK=MOBILE?L('🦶 기술 버튼','🦶 Skill'):L('Space (기술)','Space (skill)');
const ren=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
const DPRMAX=Math.min(MOBILE?1.6:2,window.devicePixelRatio||1);
let px=DPRMAX;ren.setPixelRatio(px);
ren.outputEncoding=T.sRGBEncoding;ren.toneMapping=T.ACESFilmicToneMapping;ren.toneMappingExposure=1.08;
ren.shadowMap.enabled=true;ren.shadowMap.type=T.PCFSoftShadowMap;ren.physicallyCorrectLights=false;
document.body.prepend(ren.domElement);
const scene=new T.Scene();
const SKYC=new T.Color(0xc9dcef);scene.fog=new T.Fog(SKYC,70,210);
const cam=new T.PerspectiveCamera(50,1,.1,400);
function resize(){const w=innerWidth,h=innerHeight;ren.setSize(w,h);cam.aspect=w/h;cam.fov=w/h<1?64:50;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

// sky dome with a warm sun glow
{const g=new T.SphereGeometry(300,32,16),m=new T.ShaderMaterial({side:T.BackSide,depthWrite:false,fog:false,uniforms:{sun:{value:new V3(-.45,.38,.8).normalize()}},
 vertexShader:'varying vec3 vd;void main(){vd=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:'uniform vec3 sun;varying vec3 vd;void main(){float h=clamp(vd.y,0.,1.);vec3 top=vec3(.23,.45,.78),hor=vec3(.80,.87,.94);vec3 c=mix(hor,top,pow(h,.55));float s=max(dot(vd,sun),0.);c+=vec3(1.,.85,.6)*(pow(s,40.)*.6+pow(s,6.)*.12);gl_FragColor=vec4(c,1.);}'});
 scene.add(new T.Mesh(g,m))}
const hemi=new T.HemisphereLight(0xd7e8ff,0x40592c,.72);scene.add(hemi);
const sun=new T.DirectionalLight(0xfff0d8,1.55);sun.castShadow=true;
const SM=MOBILE?1024:2048;sun.shadow.mapSize.set(SM,SM);
Object.assign(sun.shadow.camera,{left:-20,right:20,top:20,bottom:-20,near:1,far:120});sun.shadow.camera.updateProjectionMatrix();sun.shadow.bias=-.0004;sun.shadow.normalBias=.02;
scene.add(sun,sun.target);
const SUNOFF=new V3(-32,46,58);

/* ---------------- textures (all drawn here) ---------------- */
function cvs(w,h,f){const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);return c}
const ANISO=ren.capabilities.getMaxAnisotropy();
function tex(c,rep){const t=new T.CanvasTexture(c);t.encoding=T.sRGBEncoding;t.anisotropy=ANISO;if(rep){t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(rep[0],rep[1])}return t}
const grassC=cvs(512,512,(x,w,h)=>{x.fillStyle='#3d7a2b';x.fillRect(0,0,w,h);
 for(let i=0;i<26000;i++){const g=90+Math.random()*70|0,r=40+Math.random()*30|0;x.strokeStyle=`rgba(${r},${g},${30+Math.random()*25|0},${.35+Math.random()*.4})`;const X=Math.random()*w,Y=Math.random()*h,a=rnd(-.6,.6)-Math.PI/2,l=rnd(3,8);x.lineWidth=rnd(.6,1.4);x.beginPath();x.moveTo(X,Y);x.lineTo(X+Math.cos(a)*l,Y+Math.sin(a)*l);x.stroke()}
 for(let i=0;i<60;i++){x.fillStyle=`rgba(${Math.random()<.5?20:120},${Math.random()<.5?60:110},20,.05)`;x.beginPath();x.arc(Math.random()*w,Math.random()*h,rnd(20,70),0,TAU);x.fill()}});
// ball: white with curved panels (a made-up design)
const ballC=cvs(512,256,(x,w,h)=>{x.fillStyle='#f4f4f2';x.fillRect(0,0,w,h);
 const cols=['#1d3fbf','#e2231a','#111827'];for(let k=0;k<3;k++){x.strokeStyle=cols[k];x.lineWidth=16;x.beginPath();for(let i=0;i<=w;i+=4){const y=h/2+Math.sin(i/w*TAU*2+k*2.1)*h*.3;i?x.lineTo(i,y):x.moveTo(i,y)}x.stroke()}
 x.strokeStyle='rgba(0,0,0,.25)';x.lineWidth=2;for(let k=0;k<6;k++){x.beginPath();for(let i=0;i<=w;i+=4){const y=h/2+Math.sin(i/w*TAU*3+k)*h*.42;i?x.lineTo(i,y):x.moveTo(i,y)}x.stroke()}});
const netC=cvs(128,128,(x,w,h)=>{x.clearRect(0,0,w,h);x.strokeStyle='#fff';x.lineWidth=7;x.beginPath();x.moveTo(0,h/2);x.lineTo(w/2,0);x.lineTo(w,h/2);x.lineTo(w/2,h);x.closePath();x.stroke()});
const crowdC=cvs(256,256,(x,w,h)=>{x.fillStyle='#2a2f3a';x.fillRect(0,0,w,h)});
function boardC(txt,bg,fg){return cvs(1024,128,(x,w,h)=>{x.fillStyle=bg;x.fillRect(0,0,w,h);x.fillStyle=fg;x.font='900 74px system-ui,sans-serif';x.textBaseline='middle';x.textAlign='center';x.fillText(txt,w/2,h/2+4)})}

/* ---------------- pitch ---------------- */
const GW=7.32,GH=2.44,PR=.06,BR=.11;  // goal width/height, post radius, ball radius
{const gt=tex(grassC,[1,1]);const strips=22,len=110,sw=5;
 for(let i=0;i<strips;i++){const m=new T.MeshStandardMaterial({map:gt,roughness:.97,color:i%2?0xffffff:0xd6e8c8});
  const g=new T.PlaneGeometry(90,sw);const uv=g.attributes.uv;for(let k=0;k<uv.count;k++)uv.setXY(k,uv.getX(k)*90/4,uv.getY(k)*sw/4+i*sw/4);
  const p=new T.Mesh(g,m);p.rotation.x=-Math.PI/2;p.position.set(0,0,-6+i*sw+sw/2-len*0+0);p.receiveShadow=true;scene.add(p)}
 // behind the goal line
 const g2=new T.PlaneGeometry(90,40),uv2=g2.attributes.uv;for(let k=0;k<uv2.count;k++)uv2.setXY(k,uv2.getX(k)*90/4,uv2.getY(k)*10);
 const back=new T.Mesh(g2,new T.MeshStandardMaterial({map:gt,roughness:.97,color:0xc4d8b4}));back.rotation.x=-Math.PI/2;back.position.set(0,-.002,-26);back.receiveShadow=true;scene.add(back);
 // painted lines
 const lm=new T.MeshStandardMaterial({color:0xf3f6f0,roughness:.85,polygonOffset:true,polygonOffsetFactor:-2});
 const line=(x1,z1,x2,z2,w=.12)=>{const l=Math.hypot(x2-x1,z2-z1),m=new T.Mesh(new T.PlaneGeometry(w,l),lm);m.rotation.x=-Math.PI/2;m.rotation.z=Math.atan2(x2-x1,z2-z1);m.position.set((x1+x2)/2,.004,(z1+z2)/2);m.receiveShadow=true;scene.add(m)};
 line(-34,0,34,0);line(-20.16,0,-20.16,16.5);line(20.16,0,20.16,16.5);line(-20.16,16.5,20.16,16.5);
 line(-9.16,0,-9.16,5.5);line(9.16,0,9.16,5.5);line(-9.16,5.5,9.16,5.5);line(-34,0,-34,104);line(34,0,34,104);line(-34,52.5,34,52.5);
 const spot=new T.Mesh(new T.CircleGeometry(.12,16),lm);spot.rotation.x=-Math.PI/2;spot.position.set(0,.004,11);scene.add(spot);
 for(let i=0;i<24;i++){const a0=(-53+i*106/24)*D2R,a1=(-53+(i+1)*106/24)*D2R;line(Math.sin(a0)*9.15,11+Math.cos(a0)*9.15,Math.sin(a1)*9.15,11+Math.cos(a1)*9.15)}
}
/* goal frame + net */
const GOAL={net:null,base:null,bulge:[]};
{const pm=new T.MeshStandardMaterial({color:0xffffff,roughness:.35});
 const cyl=(h,x,y,z,rz)=>{const m=new T.Mesh(new T.CylinderGeometry(PR,PR,h,20),pm);m.position.set(x,y,z);if(rz)m.rotation.z=rz;m.castShadow=true;scene.add(m)};
 cyl(GH+PR,-GW/2-PR,GH/2,0);cyl(GH+PR,GW/2+PR,GH/2,0);cyl(GW+PR*4,0,GH+PR,0,Math.PI/2);
 const sm2=new T.MeshStandardMaterial({color:0xd8d8d8,roughness:.6});
 const bar=(a,b)=>{const d=new V3().subVectors(b,a),m=new T.Mesh(new T.CylinderGeometry(.025,.025,d.length(),8),sm2);m.position.copy(a).addScaledVector(d,.5);m.quaternion.setFromUnitVectors(new V3(0,1,0),d.normalize());scene.add(m)};
 for(const s of[-1,1]){bar(new V3(s*(GW/2+PR),GH,0),new V3(s*(GW/2+PR),GH,-1));bar(new V3(s*(GW/2+PR),GH,-1),new V3(s*(GW/2+PR),0,-2));bar(new V3(s*(GW/2+PR),0,-2),new V3(s*(GW/2+PR),0,0))}
 bar(new V3(-GW/2-PR,GH,-1),new V3(GW/2+PR,GH,-1));bar(new V3(-GW/2-PR,0,-2),new V3(GW/2+PR,0,-2));
 const nt=new T.CanvasTexture(netC);nt.wrapS=nt.wrapT=T.RepeatWrapping;nt.anisotropy=ANISO;
