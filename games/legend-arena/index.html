<!DOCTYPE html>
<html lang="ko">
<head><script src="../guard.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>레전드 아레나</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/*
VOICE: 밝고 웅장한 판타지 액션. HUD는 반투명 유리판, 주인공은 3D 세계
IDEA: 광장에서 뻗은 흙길이 트레이닝 룸·아레나·상점·보스 제단으로 이어지는 하나의 섬
PICTURE: 전체 화면 3D 월드 그 자체
COLOUR and TYPE: 타입 색(주먹 적색·검술 청색·활 녹색·마법 보라) + 금화색, Black Han Sans 제목 / Noto Sans KR 본문
LAYOUT: 좌상단 내 정보, 우상단 메뉴·미니맵, 하단 기술바. 터치 기기는 좌하 조이스틱·우하 기술
*/
:root{--glass:rgba(10,14,20,.66);--line:rgba(255,255,255,.16);--ink:#f5f2ea;--mut:#c4beb2;--gold:#ffd25e;--acc:#ff5a3c;--tc:#ff5a3c}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:#87b6de;color:var(--ink);font:15px/1.45 'Noto Sans KR',system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
.hide{display:none!important}
.glass{background:var(--glass);backdrop-filter:blur(12px) saturate(1.2);-webkit-backdrop-filter:blur(12px) saturate(1.2);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn{min-height:44px;padding:0 16px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid var(--line);font-weight:700;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.2)}
.btn.pri{background:var(--acc);border-color:transparent;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.btn.pri:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.hd{font-family:'Black Han Sans',sans-serif;font-weight:400;letter-spacing:.3px;line-height:1.05}
/* start */
#start{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:linear-gradient(180deg,rgba(8,12,20,.05),rgba(8,12,20,.6) 75%);overflow:auto;z-index:9}
#start .card{width:min(960px,100%);padding:clamp(18px,3vw,32px)}
#start h1{margin:0;font-size:clamp(42px,7vw,68px);text-shadow:0 4px 0 rgba(0,0,0,.3)}
#start .sub{margin:6px 0 18px;color:var(--mut)}
.field{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.field label{font-weight:900}
select{font:inherit;font-size:16px;color:var(--ink);background:rgba(0,0,0,.32);border:1px solid var(--line);border-radius:12px;min-height:44px;padding:0 10px}select option{background:#1a1e26;color:#f5f2ea}
input[type=text],input[type=password]{font:inherit;font-size:16px;color:var(--ink);background:rgba(0,0,0,.32);border:1px solid var(--line);border-radius:12px;min-height:46px;padding:0 14px;width:min(320px,100%);-webkit-user-select:text;user-select:text}
.types{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tcard{position:relative;text-align:left;padding:14px;border-radius:14px;background:rgba(255,255,255,.06);border:2px solid transparent;transition:transform .15s,border-color .15s,background .15s}
.tcard:hover{transform:translateY(-2px);background:rgba(255,255,255,.1)}
.tcard.on{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 24%,rgba(0,0,0,.2))}
.tcard svg{width:42px;height:42px;color:var(--tc)}
.tcard h3{margin:6px 0 2px;font-size:24px}
.tcard p{margin:0 0 10px;color:var(--mut);font-size:13px;min-height:38px}
.stat{display:grid;grid-template-columns:3.4em 1fr;gap:6px;align-items:center;font-size:12px;color:var(--mut);margin-top:3px}
.stat i{display:block;height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.stat i b{display:block;height:100%;background:var(--tc)}
.tcard .lvb{position:absolute;right:12px;top:12px;font-size:13px;font-weight:900;color:var(--tc)}
.go{margin-top:18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.go .btn.pri{min-width:220px;font-size:18px;min-height:52px}
.go small{color:var(--mut)}
@media(max-width:720px){.types{grid-template-columns:repeat(2,minmax(0,1fr))}.tcard p{min-height:0}}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none}
#hud>*{pointer-events:auto}
#me{position:absolute;left:12px;top:12px;width:min(300px,calc(100vw - 24px));padding:12px 14px}
.r1{display:flex;align-items:center;gap:8px}
.nm{font-weight:900;font-size:17px;max-width:62%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-bottom:1px dashed rgba(255,255,255,.4);min-height:28px}
.badge{font-size:12px;font-weight:900;padding:3px 10px;border-radius:99px;background:var(--tc);color:#fff;white-space:nowrap}
.r2{display:flex;align-items:center;gap:10px;margin-top:8px}
.lv{font-family:'Black Han Sans',sans-serif;font-size:32px;line-height:1;color:var(--tc);white-space:nowrap}
.lv small{font-size:14px;margin-right:2px;color:var(--mut)}
.xpw{flex:1}
.xpbar{height:10px;border-radius:5px;background:rgba(255,255,255,.14);overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--tc),#fff);transition:width .25s}
.xpt{font-size:12px;color:var(--mut);margin-top:3px;font-variant-numeric:tabular-nums}
.r3{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:13px;font-weight:700;align-items:center}
.coin{display:inline-flex;align-items:center;gap:5px;color:var(--gold);white-space:nowrap}
.coin i{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#ffc43a 55%,#c98a10);box-shadow:0 0 0 1px #8a5a00 inset;flex:none}
.tk{color:var(--mut);white-space:nowrap}.tk b{color:var(--ink)}
.bst{color:#7dffb0;white-space:nowrap}
#menu{position:absolute;right:12px;top:12px;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;max-width:min(470px,calc(100vw - 340px))}
#menu .btn{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#more{position:absolute;right:0;top:calc(100% + 8px);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:10px;width:300px;z-index:4}
#more .btn{width:100%;white-space:normal;line-height:1.2}
#menu{position:absolute}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ff5a3c;margin-left:6px;vertical-align:middle;box-shadow:0 0 6px #ff5a3c}
@media(max-width:760px){#more{right:auto;left:0}}
#menu .btn.pvp{background:#e0412c;border-color:transparent}
#menu .btn.up.has{background:linear-gradient(90deg,#ffb92e,#ffdc6a);color:#2a1a00;border-color:transparent}
#menu .btn.boss{background:#6b3bc4;border-color:transparent}
#mini{position:absolute;right:12px;top:68px;width:150px;height:150px;border-radius:50%;border:2px solid rgba(255,255,255,.4);box-shadow:0 8px 20px rgba(0,0,0,.3);pointer-events:none}
#prompt{position:absolute;left:50%;bottom:108px;transform:translateX(-50%);min-height:46px;padding:0 20px;border-radius:99px;font-weight:900;font-size:16px;background:rgba(255,255,255,.94);color:#1a1a1a;box-shadow:0 8px 24px rgba(0,0,0,.3);white-space:nowrap}
#prompt kbd{display:inline-grid;place-items:center;width:26px;height:26px;margin-right:8px;border-radius:7px;background:#1a1a1a;color:#fff;font:900 13px 'Noto Sans KR',sans-serif}
#prompt.info{background:rgba(10,14,20,.72);color:#fff;pointer-events:none;font-size:14px}
#bar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:8px;padding:8px}
.sk{position:relative;width:62px;height:62px;border-radius:14px;background:linear-gradient(160deg,color-mix(in srgb,var(--tc) 60%,#111),#141820);border:1px solid rgba(255,255,255,.22);overflow:hidden;display:grid;place-items:center;font-weight:900;touch-action:none}
.sk .gl{font-size:14px;line-height:1.1;text-align:center;padding:0 4px;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.sk .ky{position:absolute;left:6px;top:3px;font-size:11px;color:rgba(255,255,255,.75)}
.sk .cd{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(0,0,0,.62)}
.sk .ct{position:absolute;inset:0;display:grid;place-items:center;font-size:18px;text-shadow:0 1px 3px #000}
.sk.lock{filter:grayscale(1);opacity:.55}
.sk.dodge{--tc:#7b8597}.sk.guard{--tc:#2f7fd0}.sk.guard.on{outline:2px solid #9fd8ff;outline-offset:-2px}
#battle{position:absolute;left:50%;top:12px;transform:translateX(-50%);width:min(640px,calc(100vw - 24px));padding:10px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:center}
.hpb .nmx{display:flex;justify-content:space-between;gap:8px;font-weight:900;font-size:14px}
.hpb .nmx span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hpb .nmx em{font-style:normal;color:var(--mut);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.hpbar{height:14px;border-radius:7px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:4px;display:flex}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#33d873,#b4ff6b);transition:width .12s}
.hpb.opp .hpbar{justify-content:flex-end}
.hpb.opp .hpbar i{background:linear-gradient(90deg,#ff9b5a,#ff4b3a)}
.hpb.opp .nmx{flex-direction:row-reverse}
.vs{font-family:'Black Han Sans',sans-serif;font-size:28px;color:var(--gold)}
#forfeit{grid-column:1/-1;justify-self:center;min-height:30px;font-size:12px;padding:0 12px}
#joy{position:absolute;left:22px;bottom:26px;width:136px;height:136px;border-radius:50%;background:rgba(10,14,20,.35);border:2px solid rgba(255,255,255,.35);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 4px 12px rgba(0,0,0,.3)}
#toasts{position:fixed;left:50%;top:96px;transform:translateX(-50%);display:grid;gap:6px;justify-items:center;pointer-events:none;z-index:7;width:max-content;max-width:90vw}
.toast{padding:9px 18px;border-radius:99px;background:rgba(10,14,20,.82);font-weight:900;animation:tin .25s ease-out;text-align:center}
.toast.gold{background:linear-gradient(90deg,#ffb92e,#ffdc6a);color:#2a1a00}
.toast.bad{background:rgba(160,30,30,.88)}
@keyframes tin{from{opacity:0;transform:translateY(-8px) scale(.95)}}
#big{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:6}
#big span{font-family:'Black Han Sans',sans-serif;font-size:clamp(70px,16vw,170px);color:#fff;text-shadow:0 6px 0 rgba(0,0,0,.35),0 0 40px rgba(255,180,60,.6);animation:pop .8s ease-out both}
@keyframes pop{0%{transform:scale(2.2);opacity:0}25%{transform:scale(1);opacity:1}80%{opacity:1}100%{opacity:0;transform:scale(.92)}}
#fts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.ft{position:absolute;left:0;top:0;font:900 22px 'Noto Sans KR',sans-serif;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.65),0 0 8px rgba(0,0,0,.5);white-space:nowrap;will-change:transform}
.ft.crit{color:#ffd25e;font-size:30px}.ft.hurt{color:#ff6060}.ft.xp{color:#ffe08a;font-size:16px}.ft.miss{color:#9fd8ff;font-size:16px}
#modal{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:rgba(5,8,14,.45);z-index:8;overflow:auto}
.mbox{width:min(580px,100%);padding:22px;max-height:calc(100vh - 32px);overflow:auto}
.mbox h2{margin:0 0 4px;font-size:34px}
.mbox .muted{color:var(--mut);margin:0 0 14px}
.items{display:grid;gap:10px}
.item{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border-radius:14px;background:rgba(255,255,255,.07)}
.item .ic{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-family:'Black Han Sans',sans-serif;font-size:20px;color:#fff}
.item b{display:block}.item small{color:var(--mut);display:block}
.price{display:inline-flex;gap:5px;align-items:center;color:var(--gold);font-weight:900;white-space:nowrap}
.mrow{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.vsbox{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:center;text-align:center;margin:10px 0}
.pc{padding:14px 8px;border-radius:14px;background:rgba(255,255,255,.07);border:2px solid var(--tc)}
.pc svg{width:44px;height:44px;color:var(--tc)}.pc b{display:block;font-size:18px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pc small{color:var(--mut);display:block}
.spin{width:54px;height:54px;border-radius:50%;border:5px solid rgba(255,255,255,.15);border-top-color:var(--gold);animation:sp .8s linear infinite;margin:18px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.res-big{font-family:'Black Han Sans',sans-serif;font-size:60px;margin:0;line-height:1.1}
.res-lines{display:grid;gap:6px;margin:12px 0;font-weight:700;font-size:16px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px;align-items:center}
.keys kbd{font:900 12px 'Noto Sans KR',sans-serif;padding:4px 8px;border-radius:6px;background:rgba(255,255,255,.15);white-space:nowrap}
.tpick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.touch #bar{left:auto;right:10px;bottom:10px;transform:none;display:grid;grid-template-columns:repeat(3,62px)}
.touch #prompt{bottom:178px}
body.inb #me,body.inb #menu,body.inb #mini,body.inb #qt{display:none}
#qt{position:absolute;left:12px;top:142px;width:min(300px,calc(100vw - 24px));padding:10px 14px;text-align:left;display:block}
#qt small{display:block;color:var(--mut);font-size:12px}#qt b{display:block;font-size:15px;margin-top:2px}#qt span{display:block;font-size:13px;color:#e8e2d6}
#qt .xpbar{margin-top:6px;height:7px}#qt .xpbar i{background:var(--gold)}#qt.done{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,210,94,.55),0 10px 30px rgba(0,0,0,.25)}
.npc{padding:12px 14px;border-radius:14px;background:rgba(255,210,94,.12);border:1px solid rgba(255,210,94,.35);margin:8px 0 6px}.npc p{margin:4px 0 0;color:#f0e6cc}
.qh{margin:16px 0 8px;font-size:15px;color:var(--mut)}
.slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:6px}
.slot{min-height:64px;border-radius:12px;border:1px dashed rgba(255,255,255,.3);display:grid;place-items:center;text-align:center;font-weight:900;font-size:13px;padding:4px;background:rgba(255,255,255,.05)}
.slot.on{border:1px solid var(--tc);background:color-mix(in srgb,var(--tc) 30%,transparent)}.slot small{display:block;color:var(--mut);font-weight:700}
.btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btn.sm{min-height:38px;padding:0 12px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.stats div{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.07)}.stats small{display:block;color:var(--mut)}.stats b{font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
@media(max-width:760px){
 #qt{top:auto;bottom:auto;top:250px;width:min(240px,calc(100vw - 24px));padding:8px 12px}#qt span,#qt .xpbar{display:none}
 #me{width:min(270px,calc(100vw - 24px));padding:10px 12px}
 #menu{top:auto;bottom:auto;left:12px;right:auto;top:150px;justify-content:flex-start;max-width:calc(100vw - 24px)}
 #menu .btn{min-height:40px;padding:0 12px;font-size:13px}
 #mini{width:96px;height:96px;top:12px}
 .lv{font-size:26px}
}
#vig{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(200,20,20,.55) 100%);transition:opacity .25s}
#combo{position:fixed;right:22px;top:46%;z-index:3;pointer-events:none;text-align:right;font-family:'Black Han Sans',sans-serif;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.45),0 0 18px rgba(255,180,60,.6)}
#combo b{font-size:54px;line-height:1;font-weight:400;color:#ffd25e}#combo span{font-size:22px;margin-left:6px}#combo small{display:block;font:900 14px 'Nunito','Noto Sans KR',sans-serif;color:#ffe9a8}
#combo.pop b{animation:cpop .18s ease-out}@keyframes cpop{from{transform:scale(1.45)}}
#lockHint{position:fixed;left:50%;top:50%;transform:translate(-50%,70px);padding:10px 18px;border-radius:99px;background:rgba(10,14,20,.75);color:#fff;font-weight:900;pointer-events:none;z-index:3;white-space:nowrap;font-size:14px}
@media (prefers-reduced-motion:reduce){.toast,#big span{animation:none}}
#tut{position:fixed;top:64px;left:50%;transform:translateX(-50%);width:min(440px,calc(100vw - 24px));background:rgba(14,16,28,.82);backdrop-filter:blur(10px);border:1px solid rgba(255,210,94,.45);border-radius:16px;padding:12px 16px 12px;color:#fff;z-index:30;pointer-events:auto;box-shadow:0 10px 30px rgba(0,0,0,.35),0 0 24px rgba(255,210,94,.15);animation:tutIn .35s ease}#tut.hide{display:none}#tut .th{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:#ffd25e;letter-spacing:.02em}#tut .th b{flex:1}#tut .th button{background:none;border:0;color:rgba(255,255,255,.55);font:inherit;font-size:12px;cursor:pointer;padding:2px 4px}#tut .th button:hover{color:#fff}#tut h4{margin:6px 0 2px;font-size:18px}#tut p{margin:0;font-size:14px;line-height:1.45;color:rgba(255,255,255,.88)}#tut .tb{height:5px;border-radius:3px;background:rgba(255,255,255,.12);margin-top:10px;overflow:hidden}#tut .tb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd25e,#ff9a3c);transition:width .25s}#tut .dots{display:flex;gap:4px}#tut .dots span{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.2)}#tut .dots span.on{background:#ffd25e}#tut.pop{animation:tutPop .4s ease}@keyframes tutIn{from{opacity:0;transform:translate(-50%,-10px)}}@keyframes tutPop{40%{transform:translateX(-50%) scale(1.05);border-color:#ffd25e}}#skc{position:fixed;left:0;right:0;top:24%;display:flex;justify-content:center;pointer-events:none;z-index:5}#skc span{font-family:'Black Han Sans',sans-serif;font-size:clamp(34px,5.4vw,64px);color:#fff;letter-spacing:.04em;text-shadow:0 0 18px var(--c),0 0 42px var(--c),0 4px 0 rgba(0,0,0,.45);animation:skc .95s ease-out forwards;white-space:nowrap}#skc span.u{font-size:clamp(44px,7.5vw,92px)}#skc span::before,#skc span::after{content:'';display:inline-block;width:1.6em;height:3px;margin:0 .4em;vertical-align:middle;background:linear-gradient(90deg,transparent,var(--c));box-shadow:0 0 10px var(--c)}#skc span::after{backgrou function projMesh(fx){const g=new THREE.Group();
 if(fx.startsWith('arrow')||fx==='firearrow'||fx==='icespear'){const c=fx==='icespear'?0x9fe8ff:fx==='arrow2'?0x7fd0ff:fx==='firearrow'?0xff8a3c:0xd9ffb0;g.add(new THREE.Mesh(arrowGeo,mat(0x8a6a44)));g.add(new THREE.Mesh(headGeo,mat(0xdddddd,{metalness:.8,roughness:.3,emissive:c,emissiveIntensity:.6})));const gl=glow(c,fx==='arrow'?.8:1.6,.9);gl.position.z=.4;g.add(gl);}
 else if(fx==='wave'){const m=new THREE.MeshBasicMaterial({color:0xaee6ff,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide});const t1=new THREE.Mesh(new THREE.TorusGeometry(1.2,.12,6,28,PI),m);t1.rotation.x=PI/2;t1.rotation.z=PI;g.add(t1);const t2=new THREE.Mesh(new THREE.TorusGeometry(1,.05,6,28,PI),m);t2.rotation.x=PI/2;t2.rotation.z=PI;t2.position.z=-.15;g.add(t2);g.add(glow(0x7fd0ff,2.2,.6));}
 else if(fx==='shuriken'){const m=mat(0x2a2238,{metalness:.9,roughness:.2,emissive:0x5a2aaa,emissiveIntensity:.6});for(let k=0;k<2;k++){const b=new THREE.Mesh(new THREE.BoxGeometry(.5,.03,.12),m);b.rotation.y=k*PI/2;g.add(b);}g.add(glow(0x9a5cff,.9,.8));}
 else if(fx==='rock'){g.add(mesh(jitter(new THREE.DodecahedronGeometry(.6,0),.4),mat(0x7a746b,{flatShading:true,roughness:.95})));}
 else{const C={ice:[0xe8fbff,0x6fd8ff,.28,1.6],orb:[0xd8b0ff,0xb16dff,.25,1.4],fireball:[0xffd080,0xff6a1a,.38,2.4],fireorb:[0xffd080,0xff5a1a,.45,2.6],shadow:[0xe0c0ff,0x8a30ff,.4,2.4]}[fx]||[0xffffff,0xffffff,.3,1];g.add(new THREE.Mesh(new THREE.SphereGeometry(C[2],16,12),new THREE.MeshBasicMaterial({color:C[0]})));g.add(glow(C[1],C[3],.95));}
 return g;}
const TRAIL={ice:0x9fe8ff,icespear:0x9fe8ff,shuriken:0x8a5cff,orb:0xb16dff,fireball:0xff6a1a,fireorb:0xff5a1a,shadow:0x8a30ff,firearrow:0xff8a3c,arrow2:0x7fd0ff,wave:0x7fd0ff};
function spawnProj(f,o,dir,sk){const fx=sk.fx||'orb';const g=projMesh(fx);if(sk.tier){const tg=glow(TIERC[sk.tier],1.4+sk.tier*.7,.85);g.add(tg);}g.position.copy(o);g.quaternion.setFromUnitVectors(ZAX,dir);scene.add(g);
 projs.push({g,v:dir.clone().multiplyScalar(sk.speed),life:sk.life,dmg:sk.dmg,src:f,r:sk.size||.4,pierce:!!sk.pierce,hit:new Set(),boom:sk.boom||0,homing:sk.homing||0,fx,spin:fx==='rock'||fx==='shuriken',st:sk});}
const nv=new V3();
function updProj(dt){for(let i=projs.length-1;i>=0;i--){const p=projs[i];p.life-=dt;const P=p.g.position;
 if(p.homing){const t=pickTargetFrom(p.src,P);if(t){const sp=p.v.length();nv.set(t.pos.x-P.x,1.2*(t.sc||1)-P.y,t.pos.z-P.z).normalize().multiplyScalar(sp);p.v.lerp(nv,Math.min(1,dt*p.homing));p.v.setLength(sp);}}
 P.addScaledVector(p.v,dt);if(p.spin)p.g.rotation[p.fx==='shuriken'?'y':'x']+=dt*(p.fx==='shuriken'?22:8);else p.g.quaternion.setFromUnitVectors(ZAX,nv.copy(p.v).normalize());
 if(TRAIL[p.fx]&&Math.random()<.85)emit(pools.add,P,TRAIL[p.fx],p.fx==='wave'?1:rand(.3,.6),new V3(rand(-.3,.3),rand(-.3,.3),rand(-.3,.3)),.35,0);
 let dead=p.life<=0;
 if(!dead)for(const e of enemiesOf(p.src)){if(p.hit.has(e))continue;const dx=e.pos.x-P.x,dz=e.pos.z-P.z,rr2=e.radius+p.r;if(dx*dx+dz*dz<rr2*rr2&&P.y<2.6*(e.sc||1)){if(e===player&&e.guard&&e.gT<.22&&((P.x-e.pos.x)*Math.sin(e.yaw)+(P.z-e.pos.z)*Math.cos(e.yaw))>0){p.v.negate().multiplyScalar(1.3);p.src=e;p.hit=new Set([e]);p.life=Math.max(p.life,1.5);p.homing=0;floatText(new V3(e.pos.x,2.1,e.pos.z),'반사!','crit');impactFx(new V3(P.x,P.y,P.z),0x9fe8ff,2.6);sfx('parry');hitStop(.08);e.gst=Math.min(100,e.gst+15);if(e===player)p.dmg=Math.round(p.dmg*reflMul());break;}p.hit.add(e);if(p.boom){dead=true;break;}dealDamage(p.src,e,p.dmg,3,p.st);if(!p.pierce){dead=true;break;}}}
 if(dead){if(p.boom)explode(p);else burst(P,TRAIL[p.fx]||0xffffff,5,3,.3,.25);scene.remove(p.g);projs.splice(i,1);}}}
function pickTargetFrom(src,P){let best=null,bd=1e9;for(const e of enemiesOf(src)){const d=Math.hypot(e.pos.x-P.x,e.pos.z-P.z);if(d<bd){bd=d;best=e;}}return bd<20?best:null;}
function explode(p){const c=p.g.position.clone();c.y=0;hitCircle(p.src,c,p.boom,p.dmg,6,p.st);ringFx(c,p.boom,0xff8a3c);burst(new V3(c.x,1,c.z),0xff8a3c,30,9,.6,.6,3);dust(c,12,p.boom*.5);shake(.25);sfx('boom');}
// telegraphs
const teles=[];
function telegraph(o){
 const g=new THREE.Group();g.position.set(o.x,.07,o.z);let geo;
 if(o.shape==='circle')geo=new THREE.CircleGeometry(o.r,48);
 else if(o.shape==='cone')geo=new THREE.CircleGeometry(o.r,32,-o.arc/2,o.arc);
 else{geo=new THREE.PlaneGeometry(o.w,o.len);geo.translate(0,-o.len/2,0);}
 geo.rotateX(-PI/2);
 if(o.shape==='cone')g.rotation.y=o.yaw-PI/2;else if(o.shape==='rect')g.rotation.y=o.yaw;
 const base=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:o.color,transparent:true,opacity:.2,depthWrite:false}));
 const fill=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:o.color,transparent:true,opacity:.4,depthWrite:false,blending:THREE.AdditiveBlending}));fill.position.y=.01;fill.scale.set(.001,1,.001);
 const edge=new THREE.LineSegments(new THREE.EdgesGeometry(geo),new THREE.LineBasicMaterial({color:o.color,transparent:true,opacity:.9}));
 g.add(base,fill,edge);scene.add(g);teles.push(Object.assign({},o,{g,fill,t:0}));
}
function updTeles(dt){for(let i=teles.length-1;i>=0;i--){const T=teles[i];T.t+=dt;const p=clamp(T.t/T.delay,0,1);if(T.shape==='rect')T.fill.scale.set(1,1,Math.max(.001,p));else T.fill.scale.set(Math.max(.001,p),1,Math.max(.001,p));T.fill.material.opacity=.3+Math.sin(T.t*20)*.1;if(T.t>=T.delay){scene.remove(T.g);teles.splice(i,1);try{T.onDone&&T.onDone();}catch(e){console.error(e);}}}}

// ================= AI =================
function aiUpdate(f,dt){
 f.wish.set(0,0,0);let p=player;if(f.ffa){f.rtT=(f.rtT||0)-dt;if(f.rtT<=0||!f.tgt||!f.tgt.alive){f.rtT=rand(1.2,2.5);let best=null,bd=1e9;for(const e of enemiesOf(f)){const d=d2d(f.pos,e.pos)+(e===player?2:0);if(d<bd){bd=d;best=e;}}f.tgt=best;}p=f.tgt;if(!p)return;}f.lookAt=p.pos;
 if(!battle||!battle.live||!f.alive||!p.alive)return;
 const to=new V3(p.pos.x-f.pos.x,0,p.pos.z-f.pos.z);const d=to.length();to.normalize();
 const ranged=TYPES[f.type].range>5;const pref=ranged?TYPES[f.type].range*.8:TYPES[f.type].range*.8;
 f.strT-=dt;if(f.strT<=0){f.strT=rand(.9,2.2);f.str=Math.random()<.5?-1:1;}
 const side=new V3(to.z,0,-to.x).multiplyScalar(f.str);
 if(d>pref+1)f.wish.copy(to).addScaledVector(side,.3);
 else if(ranged&&d<pref-3)f.wish.copy(to).negate().addScaledVector(side,.5);
 else f.wish.copy(side).multiplyScalar(ranged?.8:.45);
 if(f.wish.lengthSq()>1)f.wish.normalize();
 if(f.guardT>0){f.guardT-=dt;f.guard=f.gst>5;f.wish.multiplyScalar(.4);if(f.guardT<=0||!f.guard){f.guard=false;f.guardT=0;}return;}
 f.think-=dt;if(f.think>0)return;f.think=rand(.45,.9)*(S.world>=2?.7:1);
 if(!(f.stunT>0)&&d<4.8&&f.gst>40&&(p.act||projs.some(pr=>pr.src===p&&Math.hypot(pr.g.position.x-f.pos.x,pr.g.position.z-f.pos.z)<7))&&Math.random()<(S.world>=2?.4:.25)){f.guard=true;f.gT=0;f.guardT=rand(.35,.8);return;}
 for(const pr of projs){if(pr.src!==p)continue;const rx=f.pos.x-pr.g.position.x,rz=f.pos.z-pr.g.position.z,dd=Math.hypot(rx,rz);if(dd<7&&(rx*pr.v.x+rz*pr.v.z)>0&&Math.random()<(S.world>=2?.4:.22)){doDodge(f,side);return;}}
 if(d<2.2&&ranged&&Math.random()<.2){doDodge(f,to.clone().negate().add(side));return;}
 const list=SKILLS[f.type];
 for(let i=list.length-1;i>=0;i--){const sk=list[i];if(sk.lv>f.lv||f.cds[i]>0)continue;
  if(sk.k==='blink'){if(d<3.5&&Math.random()<.6){useSkill(f,i,to.clone().negate().addScaledVector(side,.6).normalize());return;}continue;}
  if(sk.k==='backshot'&&d>5)continue;
  if(d<=skRange(sk)&&(i===0||Math.random()<(S.world>=2?.7:.5))){useSkill(f,i);return;}}
}
function bossAI(f,dt){
 f.wish.set(0,0,0);f.lookAt=player.pos;
 if(!battle||!battle.live||!f.alive||!player.alive)return;
 if(f.boss.enrage&&!f.enr&&f.hp<f.maxHp*.5){f.enr=1;const B0=f.boss;f.boss=Object.assign({},B0,{cd:B0.cd*.7,dmg:Math.round(B0.dmg*1.25)});f.speed*=1.2;bigText(ST.enr);shake(.6);sfx('boom');ringFx(f.pos,7,0xff3b30);shockFx(f.pos,9,0xff3b30);const ag=glow(0xff3b30,3.2,.45);ag.position.y=1.2;f.root.add(ag);}
 const B=f.boss,dx=player.pos.x-f.pos.x,dz=player.pos.z-f.pos.z,d=Math.hypot(dx,dz);
 if(f.busy<=0&&d>2.2*f.sc)f.wish.set(dx/d,0,dz/d);
 f.patT-=dt;if(f.patT<=0&&f.busy<=0){f.patT=B.cd*rand(.8,1.25);bossPattern(f,d<4.5&&Math.random()<.5?'slam':pick(B.pats));}
}
function bossPattern(f,pat){
 const B=f.boss,dmg=B.dmg,pp=player.pos,dir=new V3(pp.x-f.pos.x,0,pp.z-f.pos.z).normalize(),yaw=Math.atan2(dir.x,dir.z),RED=0xff3b30;f.aimYaw=yaw;f.faceT=.6;
 const at=new V3(f.pos.x,0,f.pos.z);
 switch(pat){
  case'slam':f.busy=1.25;later(.55,()=>f.alive&&f.play('slam',.6));telegraph({shape:'circle',x:at.x,z:at.z,r:4.8,delay:1.0,color:RED,onDone:()=>{if(!f.alive)return;hitCircle(f,at,4.8,dmg*1.2,10);ringFx(at,4.8,0xffb070);dust(at,24,2.5);shake(.45);sfx('boom');}});break;
  case'stomp':f.busy=1.6;later(.8,()=>f.alive&&f.play('slam',.6));telegraph({shape:'circle',x:at.x,z:at.z,r:8.5,delay:1.4,color:RED,onDone:()=>{if(!f.alive)return;hitCircle(f,at,8.5,dmg*.9,12);ringFx(at,8.5,0xffb070);dust(at,40,4);shake(.6);sfx('boom');}});break;
  case'throw':f.busy=.75;f.play('cast',.6);later(.4,()=>{if(!f.alive)return;const o=new V3(f.pos.x,1.4,f.pos.z);const dd=new V3(player.pos.x-o.x,0,player.pos.z-o.z).normalize();o.addScaledVector(dd,1.5);spawnProj(f,o,dd,{dmg,speed:17,life:2,size:.75,fx:'rock'});});break;
  case'cleave':f.busy=1.05;later(.7,()=>f.alive&&f.play('slash',.35));telegraph({shape:'cone',x:at.x,z:at.z,r:6.8,arc:2.1,yaw,delay:.8,color:RED,onDone:()=>{if(!f.alive)return;hitCone(f,at,dir,6.8,2.1,dmg*1.1,8);slashFx(f,dir,6.8,2.1,0xff8a3c);shake(.3);}});break;
  case'firewave':f.busy=.8;f.play('cast',.7);later(.35,()=>{if(!f.alive)return;for(let k=-1;k<=1;k++){const d2=dir.clone().applyAxisAngle(UP,k*.32);spawnProj(f,new V3(f.pos.x,1.4,f.pos.z).addScaledVector(d2,1.5),d2,{dmg:dmg*.8,speed:15,life:1.6,size:.6,fx:'fireorb'});}});break;
  case'charge':{f.busy=1.5;const len=15;telegraph({shape:'rect',x:at.x,z:at.z,w:3,len,yaw,delay:.85,color:RED,onDone:()=>{if(!f.alive)return;let hd=false;f.play('thrust',.45);f.faceT=.5;f.dash={dir:dir.clone(),spd:len/.45,t:.45,tick:ff=>{if(hd)return;if(d2d(ff.pos,player.pos)<ff.radius+player.radius+.6){hd=true;dealDamage(ff,player,dmg*1.3,14);}}};shake(.2);}});break;}
  case'meteors':f.busy=1.1;f.play('castup',.9);for(let k=0;k<5;k++){const c=k===0?new V3(pp.x,0,pp.z):new V3(pp.x+rand(-6,6),0,pp.z+rand(-6,6));const dl=.95+k*.2;telegraph({shape:'circle',x:c.x,z:c.z,r:2.8,delay:dl,color:RED,onDone:()=>{if(!f.alive)return;hitCircle(f,c,2.8,dmg,6);zoneFx('meteor',c,2.8);}});meteorFx(c,dl);}break;
  case'breath':{f.busy=1.6;f.play('cast',1.5);telegraph({shape:'cone',x:at.x,z:at.z,r:11,arc:1.0,yaw,delay:1.0,color:RED,onDone:()=>{if(!f.alive)return;hitCone(f,at,dir,11,1.0,dmg*1.3,8);for(let i=0;i<60;i++){const a=yaw+rand(-.5,.5),t=rand(1,11);emit(pools.add,new V3(at.x+Math.sin(a)*t,rand(.5,2),at.z+Math.cos(a)*t),0x9a40ff,rand(.6,1.4),new V3(Math.sin(a)*3,rand(0,1),Math.cos(a)*3),.6,0);}shake(.4);sfx('boom');}});break;}
  case'orbs':f.busy=.9;f.play('castup',.8);later(.4,()=>{if(!f.alive)return;for(let k=0;k<8;k++){const a=k/8*TAU;const d2=new V3(Math.sin(a),0,Math.cos(a));spawnProj(f,new V3(f.pos.x,1.4,f.pos.z).addScaledVector(d2,1.5),d2,{dmg:dmg*.55,speed:8,life:3.2,size:.5,fx:'shadow',homing:1.1});}});break;
 }
}

// ================= PROGRESSION =================
function boostOn(){return S.boostUntil>Date.now();}
function gainXP(n,boostable){if(boostable&&boostOn())n*=2;S.prog[S.type]+=n;dirty=true;checkLevel();updHUD();return n;}
function checkLevel(){if(!player)return;const L=lvInfo(S.prog[S.type]).lv;if(L===player.lv)return;const old=player.lv;player.lv=L;player.maxHp=pHp(player.type,L);if(!battle)player.hp=player.maxHp;else player.hp=Math.min(player.hp,player.maxHp);player.refreshTag();
 if(L>old){toast('레벨 업! '+TYPES[S.type].name+' Lv '+L,'gold');sfx('lv');ringFx(player.pos,3,0xffd25e);burst(new V3(player.pos.x,1,player.pos.z),0xffd25e,40,6,.5,1,-1);if(!battle)bigText('LEVEL UP');SKILLS[S.type].forEach((s,k)=>{if(s.lv>old&&s.lv<=L){const eq=S.eq[S.type];if(k>=5){const e=eq.indexOf(-1);if(e>=0)eq[e]=k;toast('새 기술 획득: '+s.n+(e>=0?' · 빈 슬롯에 장착됨':' · 스킬 인벤토리(K)에서 장착'),'gold');}else toast('새 기술 획득: '+s.n,'gold');}});if(L>15)toast('강화 스톡 +'+(L-Math.max(old,15))+' · 스킬 인벤토리(K)에서 사용','gold');}
 else toast('레벨 하락… Lv '+L,'bad');renderBar();qCheck();if(S.world===1&&!S.w2note&&w2Unlocked()){S.w2note=true;toast(WT.unlock,'gold');}}
function createPlayer(){const L=lvInfo(S.prog[S.type]).lv;return new Fighter({type:S.type,name:S.name,lv:L,team:1,isPlayer:true,up:S.up[S.type],gear:myGear()});}

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

 $('#nm').textContent=S.name;$('#tp').textContent=T.name;$('#lv').textContent=li.lv;
 $('#xpf').style.width=(li.next?li.cur/li.next*100:100)+'%';$('#xpt').textContent=li.next?`XP ${fmt(li.cur)} / ${fmt(li.next)} · 누적 ${fmt(S.prog[S.type])}`:`최고 레벨 · 누적 ${fmt(S.prog[S.type])}`;
 $('#coins').textContent=fmt(S.coins);{const st=stocks(S.type);$('#upBtn').textContent=st>0?'스킬 · 강화 '+st:'스킬';$('#upBtn').classList.toggle('has',st>0);$('#moreDot').classList.toggle('hide',!(st>0||(typeof mainDone==='function'&&mainDone())));}$('#tks').innerHTML=`티켓 <b>${S.tickets.reduce((x,y)=>x+y,0)}</b>장 · 무기 <b>${wTier()+1}단계</b> · 체력 <b>+${S.vit}</b>`;}
function renderBar(){if(!player)return;const list=SKILLS[S.type],keys=['1','2','3','4','5'],up=S.up[S.type],eq=S.eq[S.type];
 $('#bar').innerHTML=eq.map((i,slot)=>{if(i<0)return`<button class="sk lock" data-i="-1" title="빈 슬롯 · 스킬 인벤토리(K)에서 장착"><span class="ky">${keys[slot]}</span><span class="gl">빈 칸</span><span class="cd"></span><span class="ct"></span></button>`;const s=list[i];const lock=player.lv<s.lv;return`<button class="sk${lock?' lock':''}" data-i="${i}" title="${esc(s.n)} · 피해 ${s.dmg||'-'} · 재사용 ${s.cd}초${lock?' · Lv'+s.lv+' 필요':''}"><span class="ky">${keys[slot]}</span><span class="gl">${lock?'Lv'+s.lv:esc(s.n)}${!lock&&up[i]?'<br><small style="color:var(--gold)">+'+up[i]+'</small>':''}</span><span class="cd"></span><span class="ct"></span></button>`;}).join('')+`<button class="sk dodge" data-i="d" title="회피 (Space)"><span class="ky">Space</span><span class="gl">회피</span><span class="cd"></span><span class="ct"></span></button><button class="sk guard" data-i="g" title="가드 (Shift · F · 우클릭 누르고 있기)"><span class="ky">Shift</span><span class="gl">가드</span><span class="cd"></span><span class="ct"></span></button>`;}
function updBar(){if(!player)return;const els=$('#bar').children;const list=SKILLS[S.type];const eq=S.eq[S.type];for(let j=0;j<els.length;j++){if(j===SLOTS+1){const c=els[j].children;c[2].style.height=(100-player.gst)+'%';els[j].classList.toggle('on',!!player.guard);continue;}const isD=j===SLOTS;const i=isD?-1:eq[j];if(!isD&&i<0)continue;const cd=isD?Math.max(0,player.dodgeCd):player.cds[i],max=isD?1.1:list[i].cd*(1-UPC*(S.up[S.type][i]||0));const c=els[j].children;c[2].style.height=(cd>0?cd/max*100:0)+'%';c[3].textContent=cd>.05&&max>1?cd.toFixed(cd<1?1:0):'';}}
