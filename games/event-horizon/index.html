<!DOCTYPE html>
<html lang="ko">
<head><script src="../guard.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>이벤트 호라이즌 — 지구 대탈출</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 절박한 SF 재난 액션, 영화 예고편 같은 긴장감
   IDEA: 구조선 조종석의 전술 스크린
   PICTURE: 화면 전체가 게임 — 강착원반이 도는 블랙홀, 지구, 피난 행성
   COLOUR and TYPE: 심우주 검정 + 강착원반 주황 + 구조 포드 청록, Black Han Sans 타이틀 / Noto Sans KR
   LAYOUT: 16:9 고정 월드를 화면에 맞춰 레터박스, HUD는 상단 가장자리 */
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;cursor:crosshair}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=1600,H=900,GAME_TIME=180;
const F='"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
const FT='"Black Han Sans","Noto Sans KR",sans-serif';
let sc=1,ox=0,oy=0,dpr=1;
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';sc=Math.min(innerWidth/W,innerHeight/H);ox=(innerWidth-W*sc)/2;oy=(innerHeight-H*sc)/2;}
addEventListener('resize',resize);resize();

const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const fmt=n=>Math.round(n).toLocaleString('ko-KR');
const hyp=Math.hypot;
function lerpAngle(a,b,t){let d=((b-a+Math.PI*3)%(Math.PI*2))-Math.PI;return a+d*t;}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

/* ---------- 오디오 ---------- */
let AC=null,master=null,droneGain=null,muted=false;
function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0.5;master.connect(AC.destination);
 const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=36;const o2=AC.createOscillator();o2.type='sine';o2.frequency.value=54;
 const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=140;droneGain=AC.createGain();droneGain.gain.value=0;
 o.connect(f);o2.connect(f);f.connect(droneGain);droneGain.connect(master);o.start();o2.start();}catch(e){AC=null;}}
function sfx(freq,dur,type,vol,slide){if(!AC||muted)return;try{const t=AC.currentTime;const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,freq*slide),t+dur);g.gain.setValueAtTime(vol||0.2,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.05);}catch(e){}}
function noise(dur,vol,fq){if(!AC||muted)return;try{const n=Math.floor(AC.sampleRate*dur);const b=AC.createBuffer(1,n,AC.sampleRate);const d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=fq||900;const g=AC.createGain();g.gain.value=vol||0.3;s.connect(f);f.connect(g);g.connect(master);s.start();}catch(e){}}
function setDrone(v){if(droneGain&&AC)droneGain.gain.setTargetAtTime(muted?0:v,AC.currentTime,0.3);}
function toggleMute(){muted=!muted;if(master)master.gain.value=muted?0:0.5;}

/* ---------- 배경 요소 ---------- */
const stars=[];for(let i=0;i<340;i++)stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()<0.08?2.2:1.1,b:rand(0.25,1),tw:rand(0,6.28)});
const disk=[];for(let i=0;i<320;i++){const k=1.22+Math.pow(Math.random(),1.5)*2.2;disk.push({a:rand(0,6.283),k,sp:2.6/Math.pow(k,1.5),s:rand(1,2.8)});}
const conts=[];for(let i=0;i<11;i++)conts.push({lon:Math.random(),lat:rand(-1,1),w:rand(0.18,0.42),h:rand(0.12,0.32)});
const clouds=[];for(let i=0;i<9;i++)clouds.push({lon:Math.random(),lat:rand(-1.1,1.1),w:rand(0.2,0.5),h:rand(0.05,0.1)});
const cracks=[];for(let i=0;i<8;i++){const pts=[];let x=rand(-0.2,0.8),y=rand(-0.8,0.8);for(let j=0;j<5;j++){pts.push([x,y]);x+=rand(-0.25,0.25);y+=rand(-0.25,0.25);}cracks.push(pts);}
const dust=[];for(let i=0;i<90;i++)dust.push({x:Math.random()*W,y:Math.random()*H,vx:0,vy:0});

let state='boot',time=0,storyIdx=0,storyT=0,overT=0,G=null,best=0;
try{best=+localStorage.getItem('eh_best')||0;}catch(e){}
const TITLE_BH={x:1240,y:420,r:92};
let storyBH={x:1750,y:430,r:55};
function curBH(){return state==='title'?TITLE_BH:(state==='story'||state==='boot')?storyBH:G.bh;}

function grav(o,f,dt,bh){const dx=bh.x-o.x,dy=bh.y-o.y,d2=dx*dx+dy*dy,d=Math.sqrt(d2)||1,r=bh.r;const a=Math.min(3800*r*r/Math.max(d2,r*r*0.5),7000)*f;o.vx+=dx/d*a*dt;o.vy+=dy/d*a*dt;return d;}

const STORY=[
 '서기 2097년, 해왕성 궤도 너머.',
 '심우주 관측소가 빛조차 삼키는 \'무언가\'를 포착했다.',
 '떠돌이 블랙홀 「타나토스」.',
 '그것이 곧장 지구를 향해 돌진하고 있다.',
 '궤도 계산 결과 — 지구 충돌까지 남은 시간, 단 180초.',
 '발사된 탈출 포드들이 궤도를 떠돈다. 남은 구조선은 단 한 척.',
 '조종사, 바로 당신이다.',
 '포드를 회수해 화성 · 유로파 · 타이탄 · 케플러 방주로 대피시켜라.',
 '단 한 명이라도 더.'
];

/* ---------- 게임 ---------- */
function newGame(){
 G={t:0,saved:0,lost:0,delivered:0,capacity:3,
  ship:{x:560,y:450,vx:0,vy:0,ang:0,moveAng:0,hull:100,cargo:[],dashCd:0,inv:2,fireCd:0,thrust:0},
  bh:{x:1680,y:450,r:40},
  earth:{x:640,y:450,r:72,sc:1},
  planets:[
   {id:'mars',name:'화성 콜로니',x:190,y:190,r:38,col:'#d0573a',alive:true},
   {id:'europa',name:'유로파 기지',x:210,y:720,r:30,col:'#cfe3f0',alive:true},
   {id:'titan',name:'타이탄 정거장',x:1170,y:205,r:34,col:'#e0a64a',alive:true},
   {id:'ark',name:'케플러 방주',x:1150,y:700,r:30,col:'#8fe3ff',alive:true,station:true}],
  pods:[],rocks:[],bullets:[],parts:[],texts:[],rings:[],
  podTimer:0.3,rockTimer:3,chunkTimer:2,pulseTimer:32,pulseWarned:false,
  shake:0,ending:0,dead:0,banner:null,reason:''};
 for(let i=0;i<4;i++)spawnPod();
}
function spawnPod(){const e=G.earth,a=rand(0,Math.PI*2),gold=Math.random()<0.09;
 G.pods.push({x:e.x+Math.cos(a)*(e.r+14),y:e.y+Math.sin(a)*(e.r+14),vx:Math.cos(a)*rand(45,85),vy:Math.sin(a)*rand(45,85),people:gold?Math.round(rand(600,1000))*1000:Math.round(rand(50,250))*1000,gold,ph:rand(0,6),grace:0});}
function makeRock(x,y,vx,vy,size,hot){const n=9,v=[];for(let i=0;i<n;i++)v.push(rand(0.72,1.12));G.rocks.push({x,y,vx,vy,size,hp:Math.ceil(size/11),rot:rand(0,6),vr:rand(-2,2),v,hot:!!hot});}
function spawnRock(p){const e=Math.random();let x,y;
 if(e<0.4){x=W+40;y=rand(0,H);}else if(e<0.65){x=rand(300,W);y=-40;}else if(e<0.9){x=rand(300,W);y=H+40;}else{x=-40;y=rand(0,H);}
 const tx=rand(300,1300),ty=rand(150,750),d=hyp(tx-x,ty-y),sp=rand(70,170)+p*90;
 makeRock(x,y,(tx-x)/d*sp,(ty-y)/d*sp,rand(14,36));}
function burst(x,y,col,n,spd,life,size,gr){for(let i=0;i<n;i++){const a=rand(0,6.283),v=rand(0.15,1)*spd;G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rand(0.5,1)*(life||0.8),max:life||0.8,col,size:rand(1,size||3),g:gr});}}
function ftext(x,y,txt,col,size){G.texts.push({x,y,txt,col,size:size||20,life:1.6});}
function banner(txt,col){G.banner={txt,col:col||'#ffb347',t:3};}
function nearestRock(s,max){let b=null,bd=max;for(const r of G.rocks){const d=hyp(r.x-s.x,r.y-s.y);if(d<bd){bd=d;b=r;}}return b;}
function tryDash(){if(state!=='play'||!G||G.dead||G.ending)return;const s=G.ship;if(s.dashCd>0)return;
 let ix=0,iy=0;if(keys.KeyA||keys.ArrowLeft)ix--;if(keys.KeyD||keys.ArrowRight)ix++;if(keys.KeyW||keys.ArrowUp)iy--;if(keys.KeyS||keys.ArrowDown)iy++;
 if(joy.active){ix=joy.x-joy.bx;iy=joy.y-joy.by;}
 let a=(ix||iy)?Math.atan2(iy,ix):s.ang;s.vx=Math.cos(a)*980;s.vy=Math.sin(a)*980;s.inv=Math.max(s.inv,0.4);s.dashCd=1.4;
 burst(s.x,s.y,'#7ff6ff',24,240,0.5,3);sfx(240,0.25,'sawtooth',0.12,3);}
function dropCargo(){const s=G.ship;if(!s.cargo.length)return;const c=s.cargo.pop();G.pods.push({x:c.x,y:c.y,vx:s.vx*0.3+rand(-90,90),vy:s.vy*0.3+rand(-90,90),people:c.people,gold:c.gold,ph:0,grace:0.9});ftext(c.x,c.y-20,'포드를 놓쳤다!','#ffd166',18);}
function killShip(reason){const s=G.ship;if(G.dead)return;G.dead=0.001;G.reason=reason;burst(s.x,s.y,'#ffcf7a',120,420,1.4,4);burst(s.x,s.y,'#7ff6ff',60,260,1,3);for(const c of s.cargo)G.lost+=c.people;s.cargo=[];G.shake=22;noise(1.4,0.6,700);sfx(120,1.2,'sawtooth',0.3,0.2);}
function startEnding(){const s=G.ship;G.ending=0.001;
 if(!G.dead&&s.cargo.length){let t=0;for(const c of s.cargo)t+=c.people;G.saved+=t;ftext(s.x,s.y-30,'탑승 인원 탈출 성공 +'+fmt(t)+'명','#8dffb0',22);s.cargo=[];}
 for(const q of G.pods){G.lost+=q.people;q.dead=true;}
 banner('지구가 사건의 지평선에 닿았다…','#ff7a4a');noise(3,0.5,300);sfx(80,3,'sawtooth',0.35,0.3);}
function deliver(pl){const s=G.ship,n=s.cargo.length;let t=0;for(const c of s.cargo)t+=c.people;G.saved+=t;G.delivered+=n;s.hull=Math.min(100,s.hull+5*n);s.cargo=[];
 ftext(pl.x,pl.y-pl.r-30,pl.name+' 대피 완료 +'+fmt(t)+'명','#8dffb0',24);
 if(n>=3){s.dashCd=0;ftext(pl.x,pl.y-pl.r-4,'편대 보너스! 대시 충전 · 선체 수리','#7ff6ff',18);}
 burst(pl.x,pl.y,'#8dffb0',50,260,1,3);[523,659,784,1046].forEach((f,i)=>setTimeout(()=>sfx(f,0.18,'triangle',0.14),i*70));
 const nc=Math.min(6,3+Math.floor(G.delivered/8));if(nc>G.capacity){G.capacity=nc;banner('적재량 증가! 포드 '+nc+'개까지 견인 가능','#7ff6ff');}}
function gameOver(){state='over';overT=0;if(G.saved>best){best=G.saved;G.newBest=true;try{localStorage.setItem('eh_best',String(best));}catch(e){}}}

function solid(o,b,pad){const dx=o.x-b.x,dy=o.y-b.y,d=hyp(dx,dy)||1,m=b.r*(b.sc||1)+pad;if(d<m){o.x=b.x+dx/d*m;o.y=b.y+dy/d*m;const vn=(o.vx*dx+o.vy*dy)/d;if(vn<0){o.vx-=1.5*vn*dx/d;o.vy-=1.5*vn*dy/d;}}}

function updateGame(dt){
 const g=G,s=g.ship,bh=g.bh;
 if(!g.ending&&!g.dead)g.t+=dt;
 const p=clamp(g.t/GAME_TIME,0,1);
 bh.x=1680-915*Math.pow(p,1.3);bh.r=40+75*p;
 if(p>=1&&!g.ending&&!g.dead)startEnding();
 if(g.ending){g.ending+=dt;const e=g.earth;e.x+=(bh.x-e.x)*Math.min(1,dt*0.8);e.sc=Math.max(0,1-g.ending/3.6);g.shake=Math.max(g.shake,7);
  if(e.sc>0)for(let i=0;i<5;i++){const a=rand(0,6.283);g.parts.push({x:e.x+Math.cos(a)*e.r*e.sc,y:e.y+Math.sin(a)*e.r*e.sc,vx:rand(-30,30),vy:rand(-30,30),life:2,max:2,col:Math.random()<0.6?'#4fa3ff':'#5fd06a',size:rand(1.5,3.5),g:true});}
  if(g.ending>4.4){g.reason='earth';gameOver();return;}}
 if(g.dead){g.dead+=dt;if(g.dead>2.6){gameOver();return;}}
 if(g.banner){g.banner.t-=dt;if(g.banner.t<=0)g.banner=null;}
 g.shake=Math.max(0,g.shake-dt*30);
 // 중력파
 if(!g.ending&&!g.dead){g.pulseTimer-=dt;if(g.pulseTimer<=2.5&&!g.pulseWarned){g.pulseWarned=true;sfx(440,0.3,'square',0.08);setTimeout(()=>sfx(440,0.3,'square',0.08),400);}
  if(g.pulseTimer<=0){g.rings.push({r:bh.r,prev:bh.r});g.pulseTimer=rand(20,26)-p*7;g.pulseWarned=false;sfx(55,1.4,'sawtooth',0.35,0.5);g.shake=10;}}
 for(const ring of g.rings){ring.prev=ring.r;ring.r+=760*dt;}
 g.rings=g.rings.filter(r=>r.r<2100);
 const ringHit=(o,imp)=>{if(!g.rings.length)return;const d=hyp(o.x-bh.x,o.y-bh.y)||1;for(const ring of g.rings){if(d>ring.prev&&d<=ring.r){o.vx+=(bh.x-o.x)/d*imp;o.vy+=(bh.y-o.y)/d*imp;}}};
 // 행성 조석 붕괴
 for(const pl of g.planets){if(!pl.alive)continue;const d=hyp(pl.x-bh.x,pl.y-bh.y),tid=bh.r*3;
  if(!pl.warned&&d<tid*1.45){pl.warned=true;banner('⚠ '+pl.name+' 붕괴 임박! 서둘러 대피시켜라','#ffb347');}
  if(d<tid){pl.alive=false;burst(pl.x,pl.y,pl.col,90,320,1.4,4);for(let k=0;k<5;k++)makeRock(pl.x,pl.y,rand(-120,120),rand(-120,120),rand(14,26),true);banner(pl.name+' 붕괴… 남은 행성으로 향하라','#ff7a4a');g.shake=16;noise(1.2,0.45,500);}}
 // 스폰
 if(!g.ending&&!g.dead){
  g.podTimer-=dt;if(g.podTimer<=0){if(g.pods.length<12)spawnPod();g.podTimer=lerp(1.7,0.95,p);}
  g.rockTimer-=dt;if(g.rockTimer<=0){spawnRock(p);g.rockTimer=lerp(2.6,0.7,p)*rand(0.7,1.3);}
  if(p>0.55){g.chunkTimer-=dt;if(g.chunkTimer<=0){const e=g.earth,ba=Math.atan2(bh.y-e.y,bh.x-e.x)+rand(-0.7,0.7);makeRock(e.x+Math.cos(ba)*(e.r+16),e.y+Math.sin(ba)*(e.r+16),Math.cos(ba)*50,Math.sin(ba)*50,rand(10,18),true);g.chunkTimer=lerp(2,0.6,(p-0.55)/0.45);}}}
 // 함선
 if(!g.dead){
  let ix=0,iy=0;
  if(keys.KeyA||keys.ArrowLeft)ix--;if(keys.KeyD||keys.ArrowRight)ix++;if(keys.KeyW||keys.ArrowUp)iy--;if(keys.KeyS||keys.ArrowDown)iy++;
  if(joy.active){const dx=joy.x-joy.bx,dy=joy.y-joy.by,m=hyp(dx,dy);if(m>6){const k=Math.min(m,80)/80;ix=dx/m*k;iy=dy/m*k;}}
  let im=hyp(ix,iy);if(im>1){ix/=im;iy/=im;im=1;}
  if(g.ending){ix=iy=0;im=0;}
  s.vx+=ix*1050*dt;s.vy+=iy*1050*dt;s.thrust=im;
  if(im>0.1){s.moveAng=Math.atan2(iy,ix);const ba=s.moveAng+Math.PI+rand(-0.3,0.3);g.parts.push({x:s.x+Math.cos(ba)*12,y:s.y+Math.sin(ba)*12,vx:Math.cos(ba)*rand(120,220)+s.vx*0.4,vy:Math.sin(ba)*rand(120,220)+s.vy*0.4,life:0.3,max:0.3,col:Math.random()<0.5?'#7ff6ff':'#ffffff',size:rand(1.5,3)});}
  let aim;
  if(!touchMode&&mouse.used)aim=Math.atan2(mouse.y-s.y,mouse.x-s.x);
  else if(touchMode){const t=nearestRock(s,650);aim=t?Math.atan2(t.y-s.y,t.x-s.x):(im>0.1?s.moveAng:s.ang);}
  else aim=im>0.1?s.moveAng:s.ang;
  s.ang=lerpAngle(s.ang,aim,Math.min(1,dt*14));
  if(!g.ending){const d=grav(s,1,dt,bh);ringHit(s,430);if(d<bh.r*0.92){killShip('사건의 지평선 너머로 빨려 들어갔다');}}
  if(!g.dead){
   const dm=Math.exp(-1.8*dt);s.vx*=dm;s.vy*=dm;s.x+=s.vx*dt;s.y+=s.vy*dt;
   if(s.x<18){s.x=18;s.vx=Math.abs(s.vx)*0.4;}if(s.x>W-18){s.x=W-18;s.vx=-Math.abs(s.vx)*0.4;}
   if(s.y<18){s.y=18;s.vy=Math.abs(s.vy)*0.4;}if(s.y>H-18){s.y=H-18;s.vy=-Math.abs(s.vy)*0.4;}
   if(!g.ending)solid(s,g.earth,14);for(const pl of g.planets)if(pl.alive)solid(s,pl,12);
   s.dashCd=Math.max(0,s.dashCd-dt);s.inv=Math.max(0,s.inv-dt);s.fireCd-=dt;
   const firing=(!touchMode&&mouse.down)||keys.KeyJ||keys.KeyK||tbtn.fire;
   if(firing&&s.fireCd<=0&&!g.ending){s.fireCd=0.13;const a=s.ang;g.bullets.push({x:s.x+Math.cos(a)*20,y:s.y+Math.sin(a)*20,vx:Math.cos(a)*950+s.vx*0.3,vy:Math.sin(a)*950+s.vy*0.3,life:0.85});sfx(900,0.06,'square',0.04,0.5);}
   let prev=s;for(const c of s.cargo){const dx=c.x-prev.x,dy=c.y-prev.y,d=hyp(dx,dy)||1;if(d>24){c.x=prev.x+dx/d*24;c.y=prev.y+dy/d*24;}prev=c;}
   if(s.cargo.length&&!g.ending)for(const pl of g.planets){if(pl.alive&&hyp(s.x-pl.x,s.y-pl.y)<pl.r+48){deliver(pl);break;}}
  }}
 // 포드
 for(const q of g.pods){if(q.dead)continue;q.ph+=dt;q.grace=Math.max(0,q.grace-dt);
  const d=grav(q,0.5,dt,bh);ringHit(q,170);const dm=Math.exp(-0.3*dt);q.vx*=dm;q.vy*=dm;q.x+=q.vx*dt;q.y+=q.vy*dt;
  if(q.x<12||q.x>W-12)q.vx*=-1;if(q.y<12||q.y>H-12)q.vy*=-1;q.x=clamp(q.x,12,W-12);q.y=clamp(q.y,12,H-12);

 label('적재',hx,70,14,'#cfe8ff');for(let i=0;i<g.capacity;i++){ctx.beginPath();ctx.arc(hx+56+i*28,65,9,0,7);if(i<s.cargo.length){ctx.fillStyle=s.cargo[i].gold?'#ffd166':'#8dffb0';ctx.fill();}else{ctx.strokeStyle='rgba(141,255,176,0.5)';ctx.lineWidth=2;ctx.stroke();}}

 ctx.fillStyle='rgba(255,255,255,0.12)';ctx.beginPath();ctx.arc(PAUSE_BTN.x,PAUSE_BTN.y,PAUSE_BTN.r,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(PAUSE_BTN.x-7,PAUSE_BTN.y-9,5,18);ctx.fillRect(PAUSE_BTN.x+2,PAUSE_BTN.y-9,5,18);
 if(g.pulseTimer<=2.5&&!g.ending&&!g.dead&&Math.sin(time*14)>-0.2){label('⚠ 중력파 경보! 블랙홀 쪽으로 끌려간다 — 거리를 벌려라',W/2,150,24,'#c9a2ff',900,'center');}

 if(touchMode){ctx.globalAlpha=0.5;if(joy.active){ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(joy.bx,joy.by,80,0,7);ctx.stroke();const dx=joy.x-joy.bx,dy=joy.y-joy.by,m=Math.min(80,hyp(dx,dy))/(hyp(dx,dy)||1);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(joy.bx+dx*m,joy.by+dy*m,32,0,7);ctx.fill();}
  else label('왼쪽 화면을 드래그해 이동',40,H-40,18,'#fff');
  ctx.fillStyle=tbtn.fire?'#ffb347':'rgba(255,179,71,0.6)';ctx.beginPath();ctx.arc(FIRE_BTN.x,FIRE_BTN.y,FIRE_BTN.r,0,7);ctx.fill();label('사격',FIRE_BTN.x,FIRE_BTN.y+8,24,'#000',900,'center');

}

 if(state==='boot'){ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fillRect(0,0,W,H);shadowText('EVENT HORIZON',W/2,H/2-30,`72px ${FT}`,'#ffb347');shadowText('지구 대탈출 작전',W/2,H/2+20,`700 26px ${F}`,'#ffe2c2');

 const L=STORY[storyIdx]||'';const n=Math.floor(storyT*24);const shown=L.slice(0,n);

 shadowText('EVENT HORIZON',W/2,180,`110px ${FT}`,'#ffb347');shadowText('지구 대탈출 작전',W/2,236,`900 34px ${F}`,'#ffe2c2');
 ctx.fillStyle='rgba(6,10,22,0.78)';rr(W/2-400,290,800,370,18);ctx.fill();ctx.strokeStyle='rgba(255,179,71,0.35)';ctx.lineWidth=1.5;ctx.stroke();
 const rows=[['이동','WASD / 방향키'],['조준 · 사격','마우스 조준 + 클릭 (키보드: J)'],['대시 (순간 무적)','Space / Shift / 우클릭'],['일시정지 · 소리','P · M'],['모바일','왼쪽 드래그 이동, 사격(자동조준)·대시 버튼']];

 label('목표  빛나는 탈출 포드를 끌고 행성의 점선 고리 안으로 들어가면 대피 완료',W/2-350,550,17,'#8dffb0',700);
 label('주의  소행성 · 중력파 · 사건의 지평선. 오른쪽 행성은 블랙홀이 다가오면 붕괴한다',W/2-350,582,17,'#ff9a7a',700);

 if(Math.sin(time*4)>-0.3)shadowText('▶  클릭 또는 Enter로 출격',W/2,730,`900 30px ${F}`,'#ffffff');
 if(best>0)label('최고 기록 '+fmt(best)+'명',W/2,780,18,'#ffd6a8',700,'center');}

function drawOver(){const g=G;ctx.fillStyle=`rgba(0,0,0,${Math.min(0.72,overT*0.6)})`;ctx.fillRect(0,0,W,H);if(overT<0.4)return;
