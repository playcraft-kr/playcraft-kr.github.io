<!DOCTYPE html>
<html lang="ko">
<head><script src="../guard.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Merge 2048</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a quiet puzzle that sticks to your hand, for spare moments
   IDEA: a jewel box where number tiles turn from warm colors to cool gem colors as they merge
   PICTURE: the board itself is the picture, right below the title
   COLOUR and TYPE: deep navy board, coral→gold→green→teal→blue→purple tiles; Black Han Sans numbers, Gothic A1 body
   LAYOUT: small title + score row, square board, buttons below */
:root{color-scheme:light dark;--bg:light-dark(#eef0f6,#0d1020);--ink:light-dark(#151a2e,#eef1fb);--sub:light-dark(#4d5676,#9aa3c4);--board:light-dark(#232a45,#171c33);--cell:light-dark(#2f3758,#222a47);--chip:light-dark(#ffffff,#1a2036)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Gothic A1",system-ui,sans-serif;overflow-x:clip;display:flex;flex-direction:column;align-items:center;padding:20px 12px 28px}
.wrap{width:min(440px,100%)}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
h1{font:400 32px/1.05 "Black Han Sans",sans-serif;margin:0}
.sub{color:var(--sub);font-size:14px;margin:4px 0 0}
.chips{display:flex;gap:8px}
.chip{background:var(--chip);border-radius:12px;padding:6px 14px;text-align:center;min-width:76px;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.chip small{display:block;font-size:13px;color:var(--sub);font-weight:700}
.chip b{font:400 22px/1.1 "Black Han Sans",sans-serif;white-space:nowrap}
.board{position:relative;width:100%;aspect-ratio:1;background:var(--board);border-radius:18px;touch-action:none;container-type:inline-size;box-shadow:0 16px 36px rgba(10,14,40,.3);user-select:none;-webkit-user-select:none}
.cell,.tile{position:absolute;width:22%;height:22%;border-radius:10px}
.cell{background:var(--cell)}
.tile{display:flex;align-items:center;justify-content:center;font:400 13cqw/1 "Black Han Sans",sans-serif;color:#fff;transition:left .11s ease-out,top .11s ease-out;box-shadow:inset 0 -5px 0 rgba(0,0,0,.16),inset 0 3px 0 rgba(255,255,255,.22);z-index:2}
.tile.d3{font-size:10cqw}.tile.d4{font-size:8cqw}.tile.d5{font-size:6.4cqw}
.tile.new{animation:appear .16s ease-out}
.tile.pop{animation:pop .16s ease-out;z-index:3}
@keyframes appear{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes pop{50%{transform:scale(1.14)}}
.v2{background:#ff8a7a;color:#3a1410}.v4{background:#ff6f59;color:#3a1008}
.v8{background:#ffa53d;color:#3a2104}.v16{background:#ffc93c;color:#3a2a00}
.v32{background:#a8d94a;color:#1d2f05}.v64{background:#4cc48a;color:#06301c}
.v128{background:#2bb3b1;color:#03302f}.v256{background:#2f8fd9}
.v512{background:#3c63d6}.v1024{background:#6b4fd8}.v2048{background:#a347d1;box-shadow:0 0 22px #c98cff,inset 0 -5px 0 rgba(0,0,0,.16)}
.vbig{background:#1c1530;box-shadow:0 0 18px #ff6fd8,inset 0 0 0 3px #ff6fd8}
.ov{position:absolute;inset:0;border-radius:18px;background:rgba(8,10,24,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;text-align:center;padding:20px;z-index:5}
.ov[hidden]{display:none}
.ov h2{font:400 40px/1.05 "Black Han Sans",sans-serif;margin:0}
.ov p{margin:0;color:#dfe4ff}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{font:700 16px "Gothic A1",sans-serif;min-height:46px;padding:0 22px;border:0;border-radius:999px;background:#ffd166;color:#1b1430;cursor:pointer;box-shadow:0 4px 0 #c9962e}
.btn.alt{background:var(--chip);color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.18)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible{outline:3px solid #7aa7ff;outline-offset:3px}
.btn:active:not(:disabled){transform:translateY(2px)}
.controls{display:flex;gap:10px;justify-content:center;margin-top:16px}
.tips{color:var(--sub);font-size:13px;text-align:center;margin-top:12px}
@media (prefers-reduced-motion:reduce){.tile{transition:none}.tile.new,.tile.pop{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>Merge 2048</h1><p class="sub">Slide matching numbers together to make 2048.</p></div>
    <div class="chips"><div class="chip"><small>Score</small><b id="score">0</b></div><div class="chip"><small>Best</small><b id="best">0</b></div></div>
  </div>
  <div class="board" id="board" tabindex="0" aria-label="Game board. Move with arrow keys or swipe">
    <div class="ov" id="ov" hidden>
      <h2 id="ovT"></h2><p id="ovP"></p>
      <div class="row"><button class="btn" id="ovA" type="button"></button><button class="btn alt" id="ovB" type="button"></button></div>
    </div>
  </div>
  <div class="controls">
    <button class="btn alt" id="undo" type="button" disabled>Undo</button>
    <button class="btn" id="newg" type="button">New game</button>
  </div>
  <p class="tips">Swipe on a phone, or use arrow keys (or WASD) on a computer. You can undo up to 10 times.</p>
</div>
<script>
{
const N=4,G=2.4,C=(100-G*5)/4;
const board=document.getElementById('board'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');
const ov=document.getElementById('ov'),ovT=document.getElementById('ovT'),ovP=document.getElementById('ovP'),ovA=document.getElementById('ovA'),ovB=document.getElementById('ovB');
const undoBtn=document.getElementById('undo'),newBtn=document.getElementById('newg');
const pos=i=>(G+i*(C+G))+'%';
for(let r=0;r<N;r++)for(let c=0;c<N;c++){const d=document.createElement('div');d.className='cell';d.style.left=pos(c);d.style.top=pos(r);board.appendChild(d)}

let tiles=[],score=0,best=0,uid=0,history=[],won=false,keepGoing=false,busy=false;
const els=new Map();
try{best=+localStorage.getItem('m2048best')||0}catch(e){}
bestEl.textContent=best;

function empty(){const used=new Set(tiles.map(t=>t.r*N+t.c)),out=[];for(let i=0;i<N*N;i++)if(!used.has(i))out.push(i);return out}
function add(){const e=empty();if(!e.length)return;const i=e[Math.floor(Math.random()*e.length)];tiles.push({id:++uid,v:Math.random()<.9?2:4,r:Math.floor(i/N),c:i%N,fresh:true})}
function save(){try{localStorage.setItem('m2048state',JSON.stringify({t:tiles.map(t=>[t.v,t.r,t.c]),s:score,w:won,k:keepGoing}))}catch(e){}}

function render(){
  const alive=new Set();
  tiles.forEach(t=>{
    alive.add(t.id);let el=els.get(t.id);
    if(!el){el=document.createElement('div');els.set(t.id,el);board.appendChild(el)}
    const digits=String(t.v).length;
    el.className='tile '+(t.v>2048?'vbig':'v'+t.v)+(digits>2?' d'+Math.min(digits,5):'')+(t.fresh?' new':'')+(t.pop?' pop':'');
    el.textContent=t.v;el.style.left=pos(t.c);el.style.top=pos(t.r);
    t.fresh=false;t.pop=false;
  });
  for(const [id,el] of els)if(!alive.has(id)&&!el.dying){el.dying=true;setTimeout(()=>{el.remove();els.delete(id)},120)}
  scoreEl.textContent=score;
  if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('m2048best',best)}catch(e){}}
  undoBtn.disabled=!history.length;
}

function move(dir){
  if(busy||!ov.hidden)return;
  const dr=[-1,1,0,0][dir],dc=[0,0,-1,1][dir];
  const grid=[...Array(N)].map(()=>Array(N).fill(null));
  tiles.forEach(t=>grid[t.r][t.c]=t);
  const snap={t:tiles.map(t=>({...t})),s:score,w:won};
  const order=[0,1,2,3];const rs=dr>0?[...order].reverse():order,cs=dc>0?[...order].reverse():order;
  let moved=false;const merged=new Set(),dead=[];
  for(const r of rs)for(const c of cs){
    const t=grid[r][c];if(!t)continue;
    let nr=r,nc=c;
    while(true){const tr=nr+dr,tc=nc+dc;if(tr<0||tr>=N||tc<0||tc>=N)break;
      const o=grid[tr][tc];
      if(!o){nr=tr;nc=tc;continue}
      if(o.v===t.v&&!merged.has(o.id)){
        grid[r][c]=null;t.r=tr;t.c=tc;dead.push(t);o.nv=o.v*2;merged.add(o.id);score+=o.nv;moved=true;
        // the moving tile slides onto o, then disappears
        nr=null;
      }
      break;
    }
    if(nr===null)continue;
    if(nr!==r||nc!==c){grid[r][c]=null;grid[nr][nc]=t;t.r=nr;t.c=nc;moved=true}
  }
  if(!moved)return;
  history.push(snap);if(history.length>10)history.shift();
  busy=true;
  // show slide first (dead tiles included), then remove them and spawn
  render();
  setTimeout(()=>{
    tiles=tiles.filter(t=>!dead.includes(t));tiles.forEach(t=>{if(t.nv){t.v=t.nv;t.nv=0;t.pop=true}});
    add();render();save();busy=false;check();
  },reduce?0:110);
}
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

function canMove(){
  if(tiles.length<N*N)return true;
  const g=[...Array(N)].map(()=>Array(N).fill(0));tiles.forEach(t=>g[t.r][t.c]=t.v);
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(c<N-1&&g[r][c]===g[r][c+1])return true;if(r<N-1&&g[r][c]===g[r+1][c])return true}
  return false;
}
function show(t,p,a,fa,b,fb){ovT.textContent=t;ovP.textContent=p;ovA.textContent=a;ovA.onclick=fa;ovB.hidden=!b;if(b){ovB.textContent=b;ovB.onclick=fb}ov.hidden=false;ovA.focus()}
function hide(){ov.hidden=true;board.focus({preventScroll:true})}
function check(){
  if(!won&&tiles.some(t=>t.v>=2048)){won=true;save();
    show('You made 2048!',`Score: ${score}. You can keep going for even bigger numbers.`,'Resume',()=>{keepGoing=true;save();hide()},'New game',()=>{hide();start()});return}
  if(!canMove())show('No more moves',`This score: ${score} · Best: ${best}`,'New game',()=>{hide();start()},history.length?'Undo one move':null,()=>{hide();undo()});
}
function undo(){
  if(!history.length||busy)return;const s=history.pop();
  for(const [,el] of els)el.remove();els.clear();
  tiles=s.t.map(t=>({...t,fresh:false,pop:false}));score=s.s;
  won=s.w;
  ov.hidden=true;render();save();
}
function start(){
  for(const [,el] of els)el.remove();els.clear();
  tiles=[];score=0;history=[];won=false;keepGoing=false;add();add();render();save();
}
function load(){
  try{const s=JSON.parse(localStorage.getItem('m2048state')||'null');
    if(s&&s.t&&s.t.length){tiles=s.t.map(([v,r,c])=>({id:++uid,v,r,c,fresh:true}));score=s.s||0;won=!!s.w;keepGoing=!!s.k;render();if(!canMove())check();return}}catch(e){}
  start();
}

const keys={ArrowUp:0,ArrowDown:1,ArrowLeft:2,ArrowRight:3,KeyW:0,KeyS:1,KeyA:2,KeyD:3};
addEventListener('keydown',e=>{
  if(e.code in keys&&!e.metaKey&&!e.ctrlKey&&!e.altKey){if(!ov.hidden)return;e.preventDefault();move(keys[e.code])}
  else if((e.ctrlKey||e.metaKey)&&e.code==='KeyZ'){e.preventDefault();undo()}
});
let sx=0,sy=0,down=false;
board.addEventListener('pointerdown',e=>{if(!ov.hidden)return;down=true;sx=e.clientX;sy=e.clientY});
board.addEventListener('pointerup',e=>{
  if(!down)return;down=false;const dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
  if(Math.abs(dx)>Math.abs(dy))move(dx>0?3:2);else move(dy>0?1:0);
});
board.addEventListener('pointercancel',()=>down=false);
undoBtn.addEventListener('click',undo);
newBtn.addEventListener('click',()=>{hide();start()});
load();
}
</script>
</body>
</html>
