<!DOCTYPE html>
<html lang="ko">
<head><script src="../guard.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>잿빛 성채</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Noto+Sans+KR:wght@400;700;900&family=Noto+Serif+KR:wght@700;900&display=swap" rel="stylesheet">
<style>
/*
VOICE: 어둡고 묵직한 다크 판타지 액션 — 말은 적게, 화면은 크게
IDEA: 해 질 녘 폐허 투기장, 횃불과 잿가루 속 기사 한 명
PICTURE: 실시간 3D 장면이 화면 전체, HUD는 녹슨 철판에 새긴 각인처럼 얇게
COLOUR and TYPE: 뼈빛 #ece4d3, 피의 붉음 #b3141f, 강철 회색; Noto Serif KR 900 제목 + Cinzel 라틴 + Noto Sans KR 수치
LAYOUT: 좌상단 생명/기력, 중앙 상단 웨이브, 하단 경험치 선, 화면 중앙 배너
*/
:root{color-scheme:dark;--bone:#ece4d3;--blood:#b3141f;--steel:#8c919b;--ink:#0b0809}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--bone);font:15px/1.5 "Noto Sans KR",system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
#game canvas{display:block;position:fixed;inset:0}
#ov{position:fixed;inset:0;pointer-events:none}
.screen{position:fixed;inset:0;display:grid;place-items:center;text-align:center;z-index:10}
.screen[hidden],#hud[hidden],#touch[hidden]{display:none}
#title{background:radial-gradient(ellipse at 50% 60%,rgba(0,0,0,0) 0,rgba(5,3,4,.55) 55%,rgba(5,3,4,.9) 100%)}
.tbox{padding:24px;max-width:640px}
.latin{font:600 13px "Cinzel",serif;letter-spacing:.35em;color:#c7b9a0;opacity:.85}
h1{font:900 clamp(52px,10vw,104px)/1 "Noto Serif KR",serif;margin:.12em 0 .14em;color:var(--bone);text-shadow:0 4px 30px rgba(0,0,0,.8),0 0 60px rgba(179,20,31,.35);letter-spacing:.04em}
.sub{font-size:16px;color:#cfc4b0;margin:0 auto 28px;max-width:30em;text-wrap:balance}
button{font:inherit;cursor:pointer}
.big{font:700 18px "Noto Serif KR",serif;color:var(--bone);background:linear-gradient(#5a0c12,#2a0508);border:1px solid #8a2a2a;padding:14px 46px;min-height:52px;border-radius:2px;box-shadow:0 0 0 4px rgba(0,0,0,.4),0 10px 40px rgba(179,20,31,.35);transition:transform .15s,box-shadow .15s}
.big:hover,.big:focus-visible{transform:translateY(-1px);box-shadow:0 0 0 4px rgba(0,0,0,.4),0 10px 50px rgba(220,40,40,.55);outline:none}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px 18px;margin:30px auto 0;max-width:560px;font-size:14px;color:#bdb19c;text-align:left}
.keys div{display:flex;gap:10px;align-items:center}
kbd{font:700 12px "Noto Sans KR",sans-serif;display:inline-grid;place-items:center;min-width:26px;height:24px;padding:0 6px;border:1px solid #6d6153;border-bottom-width:3px;border-radius:3px;color:var(--bone);background:rgba(20,14,12,.7);white-space:nowrap}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;transition:opacity .6s}
#hud.dim{opacity:.25}
.status{position:absolute;left:22px;top:20px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;width:min(380px,calc(100vw - 44px));align-items:center}
.lv{grid-row:span 3;width:56px;height:56px;display:grid;place-items:center;border:1px solid #6a5a48;background:radial-gradient(circle at 50% 35%,#3a2a22,#120c0a);transform:rotate(45deg);margin:6px}
.lv div{transform:rotate(-45deg);text-align:center;line-height:1}
.lv b{font:900 22px "Noto Serif KR",serif;display:block}
.lv span{font:600 9px "Cinzel",serif;letter-spacing:.2em;color:#b8a78c}
.bar{position:relative;height:16px;background:rgba(10,6,6,.72);border:1px solid rgba(160,140,120,.35);overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;display:block;transition:width .08s}
#hpl{background:#e8d9b0;opacity:.55;transition:none}
#hpb{background:linear-gradient(#d4313a,#7d0d14)}
.bar em{position:absolute;right:6px;top:-1px;font:700 11px "Noto Sans KR",sans-serif;font-style:normal;color:#f6eee0;text-shadow:0 1px 2px #000}
.bar.st{height:8px}
#stb{background:linear-gradient(#ddd6c2,#9a927e)}
.bar.st.warn{animation:warn .35s}
@keyframes warn{0%,100%{border-color:rgba(160,140,120,.35)}30%{border-color:#ff4a3a;box-shadow:0 0 10px #ff4a3a}}
.meta{display:flex;gap:16px;font-size:13px;color:#d9cfbd;text-shadow:0 1px 3px #000;align-items:center}
.meta b{font-weight:900;color:var(--bone)}
#wave{position:absolute;top:22px;left:50%;transform:translateX(-50%);font:700 15px "Noto Serif KR",serif;letter-spacing:.06em;text-shadow:0 2px 8px #000;white-space:nowrap}
.xp{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.6)}
#xpb{display:block;height:100%;background:linear-gradient(90deg,#3c8fb0,#a9ecff);box-shadow:0 0 12px #6fd3ff}
.hint{position:absolute;right:20px;bottom:16px;font-size:12px;color:#a99d8a;text-shadow:0 1px 3px #000;text-align:right;line-height:1.9}
.hint kbd{min-width:22px;height:20px;font-size:11px}
#combo{position:absolute;right:48px;top:36%;text-align:right;opacity:0;transition:opacity .3s}
#combo.show{opacity:1}
#combo b{display:block;font:900 64px/1 "Noto Serif KR",serif;color:var(--bone);text-shadow:0 0 24px rgba(255,90,40,.6),0 3px 0 #5a0c12}
#combo span{font:700 14px "Noto Sans KR",sans-serif;letter-spacing:.3em;color:#e0a070}
#combo.pop b{animation:pop .22s ease-out}
@keyframes pop{0%{transform:scale(1.5)}100%{transform:scale(1)}}
#banner{position:fixed;left:0;right:0;top:30%;text-align:center;pointer-events:none;z-index:6;opacity:0}
#banner b{display:block;font:900 clamp(40px,7vw,72px)/1.05 "Noto Serif KR",serif;text-shadow:0 4px 30px #000,0 0 50px rgba(179,20,31,.5)}
#banner span{display:block;margin-top:10px;font-size:16px;color:#d8c9b0;text-shadow:0 2px 8px #000}
#banner.on{animation:ban 3.2s ease forwards}
@keyframes ban{0%{opacity:0;letter-spacing:.3em}12%{opacity:1;letter-spacing:.02em}80%{opacity:1}100%{opacity:0}}
#lvup{background:rgba(6,3,4,.72);backdrop-filter:blur(3px)}
#lvup h2{font:900 44px/1 "Noto Serif KR",serif;margin:0 0 6px}
#lvup p{margin:0 0 26px;color:#cdbfa6}
#cards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;padding:0 16px}
.card{width:200px;min-height:220px;padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--bone);background:linear-gradient(#2a1d17,#110b09);border:1px solid #6a5643;box-shadow:inset 0 0 0 4px rgba(0,0,0,.35),0 14px 40px rgba(0,0,0,.6);transition:transform .15s,border-color .15s}
.card:hover,.card:focus-visible{transform:translateY(-6px);border-color:#e0b070;outline:none}
.card b{font:900 22px/1.2 "Noto Serif KR",serif;margin-top:auto}
.card span{font-size:15px;color:#d6c7ad;margin-bottom:auto}
#pause{background:rgba(6,3,4,.6);font:700 22px "Noto Serif KR",serif;cursor:pointer}
#over{background:radial-gradient(ellipse,rgba(40,0,4,.55),rgba(4,1,2,.92))}
#over h2{font:900 clamp(48px,9vw,90px)/1 "Noto Serif KR",serif;margin:0 0 20px;color:#d63a3a;text-shadow:0 0 50px rgba(179,20,31,.7)}
#ovs{display:flex;gap:30px;justify-content:center;margin-bottom:30px;flex-wrap:wrap}
#ovs div{display:flex;flex-direction:column}
#ovs b{font:900 36px "Noto Serif KR",serif}
#ovs span{font-size:13px;color:#bfae94}
#touch{position:fixed;inset:0;z-index:7;pointer-events:none}
#stick{position:fixed;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:2px solid rgba(236,228,211,.35);background:rgba(0,0,0,.25);opacity:0;transition:opacity .15s}
#stick.on{opacity:1}
#knob{position:absolute;left:30px;top:30px;width:50px;height:50px;border-radius:50%;background:rgba(236,228,211,.5)}
.tbs{position:fixed;right:18px;bottom:22px;display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,64px);gap:10px;pointer-events:auto}
.tb{border-radius:50%;border:1px solid rgba(236,228,211,.45);background:rgba(25,12,10,.6);color:var(--bone);font:700 13px "Noto Sans KR",sans-serif;touch-action:none}
.tb.big2{grid-row:span 2;grid-column:3;border-color:#b3141f;background:rgba(90,12,18,.6);font-size:16px}
.tb.hit{background:rgba(236,228,211,.5)}
body.touch .hint{display:none}
@media(max-width:600px){.status{left:12px;top:12px}#wave{top:auto;bottom:14px;font-size:13px}#combo{right:16px}#combo b{font-size:44px}.card{width:100%;min-height:0;flex-direction:row;padding:14px}.card b{margin:0;font-size:18px}.card span{margin:0;text-align:left}#cards{flex-direction:column;width:100%;max-width:420px}}
@media(prefers-reduced-motion:reduce){#banner.on{animation-duration:.01s;opacity:1}}
</style>
</head>
<body>
<div id="game"></div>
<canvas id="ov"></canvas>
<div id="hud" hidden>
  <div class="status">
    <div class="lv"><div><b id="lv">1</b><span>LV</span></div></div>
    <div class="bar hp"><i id="hpl"></i><i id="hpb"></i><em id="hpt">100 / 100</em></div>
    <div class="bar st" id="stw"><i id="stb"></i></div>
    <div class="meta"><span>포션 <b id="pot">3</b> <kbd>Q</kbd></span><span>처치 <b id="kills">0</b></span></div>
  </div>
  <div id="wave"></div>
  <div id="combo"><b>0</b><span>연타</span></div>
  <div class="hint"><kbd>WASD</kbd> 이동 · <kbd>좌클릭</kbd> 연속베기 · <kbd>우클릭</kbd>/<kbd>F</kbd> 회전베기<br><kbd>Space</kbd> 구르기 · <kbd>Q</kbd> 포션 · 휠 시점거리</div>
  <div class="xp"><i id="xpb"></i></div>
</div>
<div id="banner"></div>
<div id="title" class="screen"><div class="tbox">
  <div class="latin">ASHEN KEEP</div>
  <h1>잿빛 성채</h1>
  <p class="sub">해가 지는 폐허의 투기장. 무덤에서 기어 나온 망자들을 베어 넘기고, 살아남을수록 강해져라.</p>
  <button class="big" id="start">전투 시작</button>
  <div class="keys">
    <div><kbd>WASD</kbd>이동</div><div><kbd>좌클릭</kbd>3연속 베기</div><div><kbd>우클릭</kbd>회전 베기</div>
    <div><kbd>Space</kbd>구르기·무적</div><div><kbd>Q</kbd>포션</div><div><kbd>마우스</kbd>시점</div>
  </div>
</div></div>
<div id="lvup" class="screen" hidden><div><h2>레벨 <span id="lvn">2</span></h2><p>하나를 골라 몸에 새겨라</p><div id="cards"></div></div></div>
<div id="pause" class="screen" hidden>일시정지 · 클릭하여 계속</div>
<div id="over" class="screen" hidden><div><h2>쓰러졌다</h2><div id="ovs"></div><button class="big" id="again">다시 일어서기</button></div></div>
<div id="touch" hidden>
  <div id="stick"><div id="knob"></div></div>
  <div class="tbs">
    <button class="tb" data-a="pot">포션</button><button class="tb" data-a="heavy">회전</button><button class="tb big2" data-a="atk">베기</button>
    <button class="tb" data-a="dodge" style="grid-column:1/3;border-radius:32px">구르기</button>
  </div>
</div>
