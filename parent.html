<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Zanycade · For parents</title>
<style>
:root{--violet:#5b3fd0;--violet-d:#3d2a8c;--ink:#1d1b3a;--ink2:#5d5a7a;--line:#e3def7;--bg:#f6f4ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:600px;margin:0 auto;padding:24px 16px 48px}
h1{color:var(--violet);margin:0 0 4px;font-size:28px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 18px 20px;margin:16px 0}
.kid{font-size:20px;font-weight:800}
.muted{color:var(--ink2);font-size:15px}
ul{padding-left:20px;margin:8px 0}
label.opt{display:flex;gap:10px;align-items:flex-start;margin:10px 0;cursor:pointer}
label.opt input{margin-top:5px;width:20px;height:20px}
.pin{display:none;margin:6px 0 0 30px}
.pin input{font-size:22px;letter-spacing:.4em;width:140px;text-align:center;padding:8px;border:2px solid var(--line);border-radius:12px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
button{font:inherit;font-weight:800;border-radius:999px;padding:12px 22px;cursor:pointer;border:2px solid var(--violet)}
.yes{background:var(--violet);color:#fff}.no{background:#fff;color:var(--violet)}
.lim{display:none;margin:10px 0 0 30px}.lim select{font:inherit;padding:6px 10px;border:2px solid var(--line);border-radius:10px;margin:4px 0 10px}
.msg{font-weight:700}.err{color:#b3123d}.ok{color:#0f8a63}
</style>
</head>
<body>
<main>
  <h1>Zanycade · For parents</h1>
  <p class="muted">Kid-made browser games. No ads, nothing for sale, no real names.</p>
  <div id="box" class="card"><p>Loading…</p></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js" integrity="sha384-AkNSQdptcXlJ0/NBZc4qGk86cDVXcCevwoWgEKIpHOEfbvlXGLlIkimQtONt8KNf" crossorigin="anonymous"></script>
<script>
(function () {
  const sb = window.supabase.createClient('https://mglfvwxlleevbvglijzl.supabase.co', 'sb_publishable_0jKAyNY2GzWyIU63M_eD3g_PkVubQ6X', { auth: { persistSession: false } });
  const box = document.getElementById('box');
  const token = (location.hash.match(/t=([0-9a-f]{20,})/) || [])[1] || '';
  history.replaceState(null, '', location.pathname);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const say = (html) => { box.innerHTML = html; };
  const CAPS = [[30, '30 minutes'], [60, '1 hour'], [90, '1 hour 30 minutes'], [120, '2 hours'], [180, '3 hours'], ['', 'No daily limit']];
  const capOpts = cur => CAPS.map(([v, t]) => `<option value="${v}" ${String(cur == null ? '' : cur) === String(v) ? 'selected' : ''}>${t}</option>`).join('')
    + (cur != null && !CAPS.some(([v]) => String(v) === String(cur)) ? `<option value="${cur}" selected>${cur} minutes</option>` : '');
  const gradeOpts = (cur, fromAge) => `<option value="" ${cur == null ? 'selected' : ''}>From the age they typed${fromAge ? ' (grade ' + fromAge + ')' : ''}</option>`
    + Array.from({ length: 12 }, (_, i) => `<option value="${i + 1}" ${cur === i + 1 ? 'selected' : ''}>Grade ${i + 1}</option>`).join('');
  if (!token) return say('<p class="msg err">This link is not complete. Please open the link from the e-mail again.</p>');
  Promise.all([sb.rpc('parent_consent_info', { p_token: token }), sb.rpc('parent_limits_info', { p_token: token })]).then(([{ data, error }, lim]) => {
    const L = (lim && lim.data && lim.data[0]) || { play_cap: 60, math_grade: null, grade_from_age: null, earn_cap: 30 };
    const r = data && data[0];
    if (error || !r) return say('<p class="msg err">This link has already been used or is not valid. Ask your child to send a new one from Zanycade (My Games).</p>');
    if (r.expired) return say('<p class="msg err">This link has run out (links work for 14 days). Ask your child to send a new one from Zanycade (My Games).</p>');
    const first = !r.approved;
    say(`
      <p class="kid">${esc(r.username)} <span class="muted">(nickname ${esc(r.nickname)}, age ${esc(r.age)})</span></p>
      <p>${first ? 'Your child made this Zanycade account and asked for your approval.' : 'Your child asked you to check their Zanycade settings.'}</p>
      <p class="muted"><b>What we keep:</b> the ID, nickname and age your child typed, which games they played and for how long, and their game progress. We don’t ask for real names, we show no ads and we sell nothing. Your e-mail is used only for this. <a href="privacy.html" target="_blank" rel="noopener">Privacy policy</a></p>
      ${first ? `<p class="muted"><b>Already on:</b> playing every game alone. <b>Turns on when you approve:</b> your child’s ID on leaderboards, online play with other players, and sending in games they made (shown with their ID).</p>` : ''}
      <hr style="border:0;border-top:1px solid var(--line)">
      <p><b>Learning mode</b> (optional)<br>Your child earns time for the other games by playing learning games first:</p>
      <ul>
        <li><b>Math Space War</b>: math questions at your child’s school grade. Right answers power up heroes in a space battle.<br><span class="muted">10 questions with 8 or more right = 1 minute of game time.</span></li>
        <!-- STUDY ARCADE: hidden while it is Coming soon.
        <li><b>Study Arcade</b>: quiz and arcade games with starter decks (every Word League word, math at your child’s grade, world capitals).<br><span class="muted">Same rule: every 10 questions with 8 or more right = 1 minute. Math Space War and Study Arcade together give up to 30 minutes a day (you can change this).</span></li>
        -->
        <li><b>Word League</b>: hard English vocabulary at the level of school entrance tests (for SSAT® prep; not affiliated with SSAT). Right answers win soccer matches.<br><span class="muted">10 coins = 1 minute. New players start with 100 coins (about 10 minutes).</span></li>
      </ul>
      <p>Only your PIN can turn learning mode off. <a href="learning.html" target="_blank" rel="noopener">How learning mode works</a></p>
      <label class="opt"><input type="radio" name="lm" value="keep" ${r.learn_mode ? '' : 'checked'}> <span>${r.learn_mode ? 'Turn learning mode off' : 'No learning mode'}</span></label>
      <label class="opt"><input type="radio" name="lm" value="on" ${r.learn_mode ? 'checked' : ''}> <span>${r.learn_mode ? 'Keep learning mode on' : 'Turn on learning mode'}</span></label>
      <div class="pin" id="pinRow" style="display:block"><label><span id="pinLbl">Parent PIN (4 numbers, keep it from your child)</span><br><input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off"></label></div>
      <div class="lim" id="limRow">
        <label>Most game time per day (other games)<br><select id="cap">${capOpts(L.play_cap)}</select></label><br>
        <label>Most game time your child can earn per day from the learning games (Math Space War and Word League together)<br><select id="earn">${[10, 20, 30, 45, 60, 90].map(v => `<option value="${v}" ${+L.earn_cap === v ? 'selected' : ''}>${v} minutes</option>`).join('')}${[10, 20, 30, 45, 60, 90].includes(+L.earn_cap) ? '' : `<option value="${L.earn_cap}" selected>${L.earn_cap} minutes</option>`}</select></label><br>
        <label>School grade for the math questions (only this grade or higher gives game time)<br><select id="grade">${gradeOpts(L.math_grade, L.grade_from_age)}</select></label>
      </div>
      <p class="msg" id="m"></p>
      <div class="btns">
        <button class="yes" id="yes">${first ? 'I’m the parent. Approve' : 'Save'}</button>
        ${first && !r.learn_mode ? '<button class="no" id="learnOnly">Learning mode only (keep it limited)</button>' : ''}
        ${first ? '<button class="no" id="no">Not now</button>' : ''}
      </div>
      ${first ? `<p class="muted" style="margin-top:8px"><b>Approve</b> also turns on leaderboards, online play and sending in games (shown with your child’s nickname). <b>Learning mode only</b> keeps all of that off.</p>` : ''}
      <details style="margin-top:18px"><summary class="muted">Use a different parent email</summary>
        <p class="muted">Links for settings, the parent PIN and passwords will go to the new email. We tell both addresses.</p>
        <label>New parent email<br><input id="newEm" type="email" autocomplete="email" style="font:inherit;padding:8px;border:2px solid var(--line);border-radius:12px;width:100%;max-width:320px"></label>
        <div class="btns"><button class="no" id="chEm">Change the email</button></div>
        <p class="msg" id="emMsg"></p>
      </details>`);
    document.getElementById('chEm').onclick = async () => {
      const em = document.getElementById('newEm').value.trim(), out = document.getElementById('emMsg');
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) { out.className = 'msg err'; out.textContent = 'That email doesn’t look right.'; return; }
      const { data: res, error } = await sb.rpc('parent_change_email', { p_token: token, p_email: em });
      out.className = 'msg ' + (res === 'ok' ? 'ok' : 'err');
      out.textContent = res === 'ok' ? 'Done. From now on, links go to the new email.' : res === 'same' ? 'That’s your child’s own email. Please use a parent’s email.' : res === 'expired' ? 'This link has run out.' : 'That didn’t work. Please try again.';
    };
    const pinRow = document.getElementById('pinRow'), limRow = document.getElementById('limRow'), m = document.getElementById('m');
    const sync = () => { const on = document.querySelector('input[name=lm]:checked').value === 'on'; document.getElementById('pinLbl').textContent = on && r.learn_mode ? 'New parent PIN (optional, 4 numbers). Leave it empty to keep your PIN.' : on ? 'Parent PIN (4 numbers, keep it from your child). Needed for learning mode, and it also opens the Word League reward settings.' : 'Parent PIN (optional, 4 numbers). It opens the Word League reward settings, so only you can change rewards.'; limRow.style.display = on ? 'block' : 'none'; };
    document.querySelectorAll('input[name=lm]').forEach(i => i.addEventListener('change', sync)); sync();
    document.getElementById('yes').onclick = async () => {
      const on = document.querySelector('input[name=lm]:checked').value === 'on', pin = document.getElementById('pin').value.trim();
      if (on && !r.learn_mode && !/^[0-9]{4}$/.test(pin)) { m.className = 'msg err'; m.textContent = 'Please choose a 4-number PIN for learning mode.'; return; }
      if (pin && !/^[0-9]{4}$/.test(pin)) { m.className = 'msg err'; m.textContent = 'The PIN must be 4 numbers (or leave it empty).'; return; }
      const learn = on ? (r.learn_mode && !pin ? null : true) : (r.learn_mode ? false : null); // already on + no new PIN: keep it as it is
      if (on) {
        const cv = document.getElementById('cap').value, gv = document.getElementById('grade').value;
        const { data: lr, error: le } = await sb.rpc('parent_save_limits', { p_token: token, p_play_cap: cv === '' ? null : +cv, p_math_grade: gv === '' ? null : +gv, p_earn_cap: +document.getElementById('earn').value });
        if (le || lr !== 'ok') { m.className = 'msg err'; m.textContent = lr === 'expired' ? 'This link has run out.' : 'That didn’t work. Please try again.'; return; }
      }
      const { data: res, error: e2 } = await sb.rpc('parent_decide', { p_token: token, p_approve: true, p_learn: learn, p_pin: pin || null });
      if (e2 || res !== 'ok') { m.className = 'msg err'; m.textContent = res === 'expired' ? 'This link has run out.' : 'That didn’t work. Please try again.'; return; }
      say(`<p class="msg ok">Thank you! ${first ? esc(r.username) + '’s account is approved.' : 'Saved.'} ${on ? (r.learn_mode && !pin ? 'Learning mode stays on.' : 'Learning mode is on with your PIN.') : (r.learn_mode ? 'Learning mode is off.' : '')}</p><p class="muted">We sent you a confirmation e-mail. You can close this page.</p>`);
    };
    const again = '<p class="muted">Changed your mind? Open this same link again while it still works, or ask your child to press <b>Ask my parent</b> in My Games for a new one.</p>';
    const lo = document.getElementById('learnOnly');
    if (lo) lo.onclick = async () => {
      const pin = document.getElementById('pin').value.trim();
      if (!/^[0-9]{4}$/.test(pin)) { document.querySelector('input[name=lm][value=on]').checked = true; sync(); m.className = 'msg err'; m.textContent = 'Please choose a 4-number PIN for learning mode.'; document.getElementById('pin').focus(); return; }
      const cv = document.getElementById('cap').value, gv = document.getElementById('grade').value;
      const { data: lr, error: le } = await sb.rpc('parent_save_limits', { p_token: token, p_play_cap: cv === '' ? null : +cv, p_math_grade: gv === '' ? null : +gv, p_earn_cap: +document.getElementById('earn').value });
      if (le || lr !== 'ok') { m.className = 'msg err'; m.textContent = lr === 'expired' ? 'This link has run out.' : 'That didn’t work. Please try again.'; return; }
      const { data: res, error: e2 } = await sb.rpc('parent_decide', { p_token: token, p_approve: false, p_learn: true, p_pin: pin });
      if (e2 || res !== 'learn') { m.className = 'msg err'; m.textContent = res === 'expired' ? 'This link has run out.' : 'That didn’t work. Please try again.'; return; }
      say('<p class="msg ok">Learning mode is on with your PIN. The account stays limited: your child can play alone, and nothing about them is shown to other players.</p>' + again);
    };
    const no = document.getElementById('no');
    if (no) no.onclick = async () => {
      await sb.rpc('parent_decide', { p_token: token, p_approve: false, p_learn: null, p_pin: null });
      say('<p class="msg">OK. Nothing changed: your child can play alone, but nothing about them is shown to other players. To delete the account completely, see the <a href="privacy.html">privacy policy</a>.</p>' + again);
    };
  });
})();
</script>
</body>
</html>
